<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bitácora Táctico</title>
<style>
:root {
  --bg:#f4f5f7; --card:#ffffff; --text:#17202a; --muted:#68707a;
  --accent:#1f4f76; --line:#dfe4ea; --good:#1f7a4c; --mid:#b7791f; --bad:#b23a3a;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 18px}
h1{font-size:20px;margin:0 0 4px} .sub{font-size:13px;color:var(--muted)}
.wrap{max-width:1200px;margin:auto;padding:16px}
.toolbar{display:grid;grid-template-columns:minmax(260px,1.2fr) minmax(210px,.9fr) auto auto;gap:10px;margin-bottom:14px}
select,button{font:inherit;border:1px solid var(--line);border-radius:10px;background:white;padding:10px 12px}
button{cursor:pointer} button.primary{background:var(--accent);color:white;border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0 16px}
.stat{background:white;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px} .stat span{font-size:12px;color:var(--muted)}
.progress{height:10px;background:#e6e9ed;border-radius:99px;overflow:hidden;margin-top:6px}
.progress>div{height:100%;background:var(--accent);width:0%}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px 0;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.meta{font-size:12px;color:var(--muted);margin-bottom:8px}
.q{font-size:18px;font-weight:700;line-height:1.35;margin-bottom:12px}
.answer{display:none;border-left:4px solid var(--accent);background:#f7fafc;padding:10px 12px;border-radius:8px;margin:10px 0;line-height:1.45}
.answer.show{display:block}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.grade{font-weight:700}
.grade.good.active{background:#e7f5ed;color:var(--good);border-color:#9fd0b5}
.grade.mid.active{background:#fff4df;color:var(--mid);border-color:#e3bf7a}
.grade.bad.active{background:#fdeaea;color:var(--bad);border-color:#e3a4a4}
.reveal{margin-left:auto}
.empty{padding:28px;text-align:center;color:var(--muted)}
footer{padding:28px 16px;text-align:center;color:var(--muted);font-size:12px}
@media(max-width:780px){
  .toolbar{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .reveal{margin-left:0}
  .q{font-size:17px}
}
@media print{
  header,.toolbar,.actions,.stats{display:none!important} body{background:white}
  .card{break-inside:avoid;box-shadow:none} .answer{display:block}
}

/* ===== Mejoras para tablet y móvil ===== */
.mobile-nav{display:none}
.mobile-count{font-weight:700;color:var(--accent)}
@media(max-width:900px){
  header{position:static;padding:12px 14px}
  h1{font-size:19px}
  .sub{font-size:12px;line-height:1.35}
  .wrap{padding:10px}
  .toolbar{
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:10px;
  }
  .toolbar select{min-width:0;width:100%}
  .toolbar button{width:100%}
  .stats{
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin:8px 0 10px;
  }
  .stat{padding:9px 5px;border-radius:10px}
  .stat:first-child{grid-column:1 / -1;text-align:left;padding:10px 12px}
  .stat:first-child b{display:inline-block;margin-right:8px}
  .stat b{font-size:18px}
  .stat span{font-size:10px}
  .progress{margin-top:7px}
  .card{
    margin:8px 0 74px;
    padding:15px 14px;
    border-radius:12px;
    box-shadow:none;
  }
  .meta{font-size:11px;line-height:1.3;margin-bottom:7px}
  .q{font-size:20px;line-height:1.35;margin-bottom:14px}
  .answer{font-size:16px;line-height:1.45;padding:11px;margin:10px 0 14px}
  .actions{
    position:sticky;
    bottom:0;
    z-index:12;
    background:rgba(244,245,247,.96);
    backdrop-filter:blur(10px);
    padding:9px 0 calc(9px + env(safe-area-inset-bottom));
    margin:0 -4px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
  }
  .actions button{
    min-height:48px;
    padding:9px 5px;
    font-size:14px;
  }
  .actions .reveal{
    grid-column:1/-1;
    order:-1;
    margin:0;
    min-height:44px;
  }
  .mobile-nav{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    gap:8px;
    align-items:center;
    position:fixed;
    left:0;right:0;bottom:0;
    z-index:30;
    background:white;
    border-top:1px solid var(--line);
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  }
  .mobile-nav button{min-height:44px}
  .mobile-nav button:last-child{justify-self:stretch}
  .mobile-nav button:first-child{justify-self:stretch}
  footer{padding-bottom:80px}
}
@media(max-width:560px){
  .toolbar{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:first-child{grid-column:1/-1}
  .q{font-size:19px}
  .actions{grid-template-columns:1fr}
  .actions .reveal{grid-column:1}
  .actions button{min-height:46px}
  .card{margin-bottom:120px}
}

</style>
</head>
<body>
<header>
  <h1>Bitácora digital · Táctico</h1>
  <div class="sub">Evaluación por secciones, guardado automático y porcentaje de aprendizaje.</div>
</header>
<div class="wrap">
  <div class="toolbar">
    <select id="sectionFilter"></select>
    <select id="modeFilter">
      <option value="all">Todas</option>
      <option value="unanswered">Solo sin evaluar</option>
      <option value="wrong">Solo incompletas / incorrectas</option>
      <option value="correct">Solo correctas</option>
    </select>
    <button id="shuffleBtn">Mezclar</button>
    <button id="resetBtn">Nueva evaluación</button>
  </div>

  <div class="stats">
    <div class="stat"><b id="score">0%</b><span>Aprendizaje</span><div class="progress"><div id="progressBar"></div></div></div>
    <div class="stat"><b id="answered">0</b><span>Contestadas</span></div>
    <div class="stat"><b id="correct">0</b><span>Correctas</span></div>
    <div class="stat"><b id="partial">0</b><span>Incompletas</span></div>
    <div class="stat"><b id="incorrect">0</b><span>Incorrectas</span></div>
  </div>

  <div id="list"></div>
</div>

<div class="mobile-nav" id="mobileNav">
  <button id="prevBtn">← Anterior</button>
  <div class="mobile-count" id="mobileCount">1 / 1</div>
  <button id="nextBtn">Siguiente →</button>
</div>

<footer>Correcta = 100%, Incompleta = 50%, Incorrecta = 0%. El avance queda guardado en este dispositivo.</footer>

rea?", "answer": "Instituciones armadas permanentes.", "source": "Manual, pág. 1"}, {"id": "norm-10", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "topic": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "question": "Art. 2. ¿Cómo pueden realizarse las misiones?", "answer": "Por el Ejército, la Fuerza Aérea, la Armada o con otras dependencias, conforme lo ordene o apruebe el Presidente de la República.", "source": "Manual, pág. 1"}, {"id": "norm-11", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "topic": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "question": "Art. 3. ¿Cómo deben estar el Ejército y la Fuerza Aérea?", "answer": "Organizados, adiestrados y equipados conforme a los requerimientos.", "source": "Manual, pág. 1"}, {"id": "norm-12", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "topic": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "question": "Art. 11. ¿A quién corresponde el mando supremo?", "answer": "Al Presidente de la República, denominado Comandante Supremo de las Fuerzas Armadas.", "source": "Manual, pág. 2"}, {"id": "norm-13", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "topic": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "question": "Art. 12. ¿En qué casos interviene el mando supremo respecto de operaciones militares?", "answer": "En operaciones militares con más de una Fuerza Armada o en la salida de tropas fuera del territorio nacional.", "source": "Manual, pág. 2"}, {"id": "norm-14", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", rgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "question": "Art. 59 Bis. ¿Qué tiene a su cargo la Fuerza Aérea?", "answer": "La defensa del espacio aéreo, inteligencia aérea, vigilancia y protección, búsqueda y salvamento aéreo y la seguridad del espacio aéreo.", "source": "Manual, pág. 2"}, {"id": "norm-20", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "topic": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "question": "Art. 63. ¿Cuál es la misión de las Unidades de Vuelo?", "answer": "El combate y las operaciones aéreas militares.", "source": "Manual, pág. 2"}, {"id": "norm-21", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "topic": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "question": "Art. 67. ¿Qué función cumplen los Servicios?", "answer": "Brindan apoyo administrativo y logístico para satisfacer las necesidades de vida y operación.", "source": "Manual, pág. 2"}, {"id": "norm-22", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "topic": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "question": "Art. 179. ¿Cuáles son las Reservas?", "answer": "Primera Reserva y Segunda Reserva.", "source": "Manual, pág. 2"}, {"id": "norm-23", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "topic": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "question": "Art. 180. ¿Cómo se integra la Primera Reserva?", "answer": "Con generales, jefes, oficiales y sargentos profesionales separados del activo; clases y oficiales del Servicio Militar Nacional; soldados de conscripción; mexicanos que cumplan 19 años; y mexicanos mayores de 19 años, sin límite máximo de edad, clasificados de posible utilidad.", "source": "Manual, pág. 2"}, {"id": "norm-24", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "topic": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "question": "Art. 181. ¿Cómo se integra la Segunda Reserva?", "answer": "Con personal que concluyó la Primera Reserva y esté físicamente apto; cabos y soldados hasta 45 años; clases y oficiales hasta 45 y 50 años; y soldados de conscripción cumplidos hasta 40 años.", "source": "Manual, pág. 2"}, {"id": "norm-25", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "topic": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "question": "Art. 182. ¿Qué sucede con la jerarquía al pasar a las Reservas?", "answer": "El personal conserva su jerarquía.", "source": "Manual, pág. 2"}, {"id": "norm-26", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "topic": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "question": "Art. 183. ¿Quién puede movilizar las Reservas?", "answer": "Únicamente el Presidente de la República.", "source": "Manual, pág. 2"}, {"id": "norm-27", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "topic": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "question": "Art. 183. ¿En qué casos se moviliza la Primera Reserva?", "answer": "Guerra internacional, alteración del orden y la paz interior y grandes maniobras.", "source": "Manual, pág. 2"}, {"id": "norm-28", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "topic": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "question": "Art. 183. ¿En qué casos se moviliza la Segunda Reserva?", "answer": "Guerra internacional, grave alteración del orden y la paz interior y pequeñas maniobras.", "source": "Manual, pág. 2"}, {"id": "norm-29", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "topic": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "question": "Art. 184. ¿Cómo se considera a los reservistas movilizados?", "answer": "Como personal activo hasta la desmovilización.", "source": "Manual, pág. 2"}, {"id": "norm-30", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "topic": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "question": "Art. 185. ¿Qué sucede con los reservistas que obtengan un grado superior a Capitán Primero?", "answer": "Conservarán ese grado en las Reservas.", "source": "Manual, pág. 2"}, {"id": "norm-31", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "topic": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "question": "Art. 186. ¿Qué se hará en maniobras o emergencia?", "answer": "Se dotará de cuadros de generales, jefes, oficiales y clases.", "source": "Manual, pág. 2"}, {"id": "norm-32", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "topic": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "question": "Art. 187. ¿Qué puede hacer el Secretario de la Defensa Nacional respecto de los reservistas?", "answer": "Llamarlos para ejercicios o para comprobar su presencia, por el tiempo indispensable.", "source": "Manual, pág. 2"}, {"id": "norm-33", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "topic": "Ley Orgánica del Ejército y Fuerza Aérea Mexicanos (LOEFAM)", "question": "Art. 188. ¿Qué mantendrá la SEDENA respecto del personal?", "answer": "Un registro permanente del personal.", "source": "Manual, pág. 2"}, {"id": "norm-34", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley para Conservar la Neutralidad del País (LPCNP)", "topic": "Ley para Conservar la Neutralidad del País (LPCNP)", "question": "¿Qué establece esta ley?", "answer": "Establece supuestos que deben evitarse para no comprometer la situación de neutralidad del país ante otras naciones.", "source": "Manual, pág. 2"}, {"id": "norm-35", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley para Conservar la Neutralidad del País (LPCNP)", "topic": "Ley para Conservar la Neutralidad del País (LPCNP)", "question": "Art. 1. ¿En qué o dónde no serán permitidos beligerantes?", "answer": "PENDIENTE: este artículo no está desarrollado en el archivo Táctico Completo(1).docx. Usar tu hoja de respuestas/material complementario.", "source": ""}, {"id": "norm-36", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley para Conservar la Neutralidad del País (LPCNP)", "topic": "Ley para Conservar la Neutralidad del País (LPCNP)", "question": "Art. 3. ¿Qué no debe permitirse del país beligerante?", "answer": "PENDIENTE: este artículo no está desarrollado en el archivo Táctico Completo(1).docx. Usar tu hoja de respuestas/material complementario.", "source": ""}, {"id": "norm-37", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley para Conservar la Neutralidad del País (LPCNP)", "topic": "Ley para Conservar la Neutralidad del País (LPCNP)", "question": "Art. 4. ¿Qué no se permitirá de los beligerantes?", "answer": "PENDIENTE: este artículo no está desarrollado en el archivo Táctico Completo(1).docx. Usar tu hoja de respuestas/material complementario.", "source": ""}, {"id": "norm-38", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley de Seguridad Nacional (LSN)", "topic": "Ley de Seguridad Nacional (LSN)", "question": "¿Qué establece la Ley de Seguridad Nacional?", "answer": "Las bases de integración y acción coordinada de las instituciones y autoridades encargadas de preservar la Seguridad Nacional, y la colaboración de los tres órdenes de gobierno.", "source": "Manual, pág. 2"}, {"id": "norm-39", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley de Seguridad Nacional (LSN)", "topic": "Ley de Seguridad Nacional (LSN)", "question": "Art. 3. ¿Qué comprende la Seguridad Nacional?", "answer": "Protección de la Nación frente a amenazas y riesgos; preservación de la soberanía e independencia nacional y defensa del territorio; mantenimiento del orden constitucional y fortalecimiento de las instituciones democráticas; mantenimiento de la unidad de la Federación; defensa legítima del Estado Mexicano respecto de otros Estados o sujetos de Derecho Internacional; y preservación de la democracia fundada en el desarrollo económico, social y político del país.", "source": "Manual, pág. 2"}, {"id": "norm-40", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley de Seguridad Nacional (LSN)", "topic": "Ley de Seguridad Nacional (LSN)", "question": "Art. 5. ¿Qué actos se consideran amenazas a la Seguridad Nacional?", "answer": "Entre otros: espionaje, sabotaje, terrorismo, rebelión, traición a la patria y genocidio; interferencia extranjera; actos que impidan actuar contra la delincuencia organizada; actos que quebranten la unidad de la Federación; actos que obstaculicen operaciones militares o navales contra la delincuencia organizada; actos contra la seguridad de la aviación; actos contra personal diplomático; tráfico ilegal de materiales nucleares y armas de destrucción masiva; actos ilícitos contra la navegación marítima; financiamiento terrorista; actos que obstaculicen inteligencia o contrainteligencia; y destrucción o inhabilitación de infraestructura estratégica.", "source": "Manual, pág. 3"}, {"id": "norm-41", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley de Protección del Espacio Aéreo Mexicano (LPEAM)", "topic": "Ley de Protección del Espacio Aéreo Mexicano (LPEAM)", "question": "¿Qué establece y regula la LPEAM?", "answer": "Las medidas, acciones y procedimientos para preservar la seguridad y la soberanía del Espacio Aéreo Mexicano.", "source": "Manual, pág. 3"}, {"id": "norm-42", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley de Protección del Espacio Aéreo Mexicano (LPEAM)", "topic": "Ley de Protección del Espacio Aéreo Mexicano (LPEAM)", "question": "Art. 2. ¿Cómo garantiza el Ejecutivo Federal la soberanía sobre el espacio aéreo?", "answer": "Mediante su vigilancia y protección coordinada.", "source": "Manual, pág. 3"}, {"id": "norm-43", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley de Protección del Espacio Aéreo Mexicano (LPEAM)", "topic": "Ley de Protección del Espacio Aéreo Mexicano (LPEAM)", "question": "Art. 3. ¿Qué dependencia coordina la participación de las autoridades correspondientes?", "answer": "La SEDENA.", "source": "Manual, pág. 3"}, {"id": "norm-44", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley Federal de Armas de Fuego y Explosivos (LFAFE)", "topic": "Ley Federal de Armas de Fuego y Explosivos (LFAFE)", "question": "¿Qué establece la LFAFE en este tema?", "answer": "Las armas y explosivos para uso exclusivo de las Fuerzas Armadas Mexicanas.", "source": "Manual, pág. 3"}, {"id": "norm-45", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley Federal de Armas de Fuego y Explosivos (LFAFE)", "topic": "Ley Federal de Armas de Fuego y Explosivos (LFAFE)", "question": "Art. 71. ¿Qué ocurre con fábricas, plantas, talleres, almacenes y establecimientos de armas en caso de guerra o alteración del orden público?", "answer": "Quedan bajo la dirección y control de la SEDENA.", "source": "Manual, pág. 3"}, {"id": "norm-46", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley de Expropiación", "topic": "Ley de Expropiación", "question": "¿Qué establece y regula la Ley de Expropiación?", "answer": "Establece las causas de utilidad pública y regula los procedimientos, modalidades y la ejecución de las expropiaciones.", "source": "Manual, pág. 3"}, {"id": "norm-47", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley de Expropiación", "topic": "Ley de Expropiación", "question": "Art. 1. ¿Qué se considera causa de utilidad pública relacionada con guerra o defensa?", "answer": "La satisfacción de necesidades colectivas en caso de guerra o trastornos interiores, y los medios para la defensa nacional o el mantenimiento de la paz pública.", "source": "Manual, pág. 3"}, {"id": "norm-48", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley de Expropiación", "topic": "Ley de Expropiación", "question": "Art. 2 Bis. ¿Quién hace la declaración de utilidad pública?", "answer": "El Ejecutivo Federal, que además decreta la medida correspondiente.", "source": "Manual, pág. 3"}, {"id": "norm-49", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley de Expropiación", "topic": "Ley de Expropiación", "question": "Art. 2 Bis. ¿Qué formas de afectación pueden proceder?", "answer": "Ocupación temporal total o parcial, o limitación de los derechos de dominio, para fines del Estado o en interés de la colectividad.", "source": "Manual, pág. 3"}, {"id": "norm-50", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley de Expropiación", "topic": "Ley de Expropiación", "question": "Art. 4. ¿Cómo se hace la declaratoria de expropiación, ocupación temporal o limitación de dominio?", "answer": "Mediante decreto del Ejecutivo Federal publicado en el Diario Oficial de la Federación, previa declaración de utilidad pública.", "source": "Manual, pág. 3"}, {"id": "norm-51", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley de Aviación Civil (LAC)", "topic": "Ley de Aviación Civil (LAC)", "question": "Art. 83. ¿En qué casos puede utilizarse la requisa?", "answer": "En caso de desastres naturales, guerra o grave alteración del orden público.", "source": "Manual, pág. 3"}, {"id": "norm-52", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley de Aviación Civil (LAC)", "topic": "Ley de Aviación Civil (LAC)", "question": "Art. 83. ¿De qué puede hacerse requisa o utilización?", "answer": "De aeronaves y equipos, y puede utilizarse al personal de los servicios públicos de transporte aéreo.", "source": "Manual, pág. 3"}, {"id": "norm-53", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley de Aviación Civil (LAC)", "topic": "Ley de Aviación Civil (LAC)", "question": "Art. 83. ¿Cuánto dura la requisa?", "answer": "Mientras subsistan las causas que la motivaron.", "source": "Manual, pág. 3"}, {"id": "norm-54", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ley de Aviación Civil (LAC)", "topic": "Ley de Aviación Civil (LAC)", "question": "Art. 83. ¿Cómo se indemnizan los daños y perjuicios?", "answer": "El Gobierno Federal indemniza daños y perjuicios a su valor real; si no hay acuerdo, los daños los fijan peritos de ambas partes y los perjuicios se calculan con base en el promedio del ingreso neto del año anterior a la requisa.", "source": "Manual, pág. 3"}, {"id": "norm-55", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Código Penal Federal (CPF)", "topic": "Código Penal Federal (CPF)", "question": "¿Qué expone y describe el Código Penal Federal?", "answer": "Los delitos como conductas contrarias a la ley sancionadas penalmente.", "source": "Manual, pág. 3"}, {"id": "norm-56", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Código Penal Federal (CPF)", "topic": "Código Penal Federal (CPF)", "question": "¿Cuáles son los tres grupos de delitos que aparecen en este apartado?", "answer": "Delitos contra la seguridad de la nación; delitos contra el Derecho Internacional; y delitos contra la humanidad.", "source": "Manual, pág. 3"}, {"id": "norm-57", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Código Penal Federal (CPF)", "topic": "Código Penal Federal (CPF)", "question": "¿Qué delitos se mencionan contra la seguridad de la nación?", "answer": "Traición a la patria, espionaje, sedición, motín, rebelión, terrorismo, financiamiento al terrorismo, sabotaje y conspiración.", "source": "Manual, pág. 3"}, {"id": "norm-58", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Código Penal Federal (CPF)", "topic": "Código Penal Federal (CPF)", "question": "¿Qué delitos se mencionan contra el Derecho Internacional?", "answer": "Piratería, violación a la inmunidad y neutralidad, y terrorismo internacional.", "source": "Manual, pág. 3"}, {"id": "norm-59", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Código Penal Federal (CPF)", "topic": "Código Penal Federal (CPF)", "question": "¿Qué delitos se mencionan contra la humanidad?", "answer": "Violación de los deberes de humanidad y genocidio.", "source": "Manual, pág. 3"}, {"id": "norm-60", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Código de Justicia Militar (CJM)", "topic": "Código de Justicia Militar (CJM)", "question": "¿Qué describe el Código de Justicia Militar?", "answer": "Las conductas contrarias a la ley que son sancionadas dentro del fuero de guerra, cuando se afecte la disciplina militar.", "source": "Manual, pág. 4"}, {"id": "norm-61", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Código de Justicia Militar (CJM)", "topic": "Código de Justicia Militar (CJM)", "question": "Art. 57. ¿Qué se considera delito contra la disciplina militar?", "answer": "Los previstos en el Libro Segundo del Código, con las excepciones del artículo 337 Bis; y ciertos delitos del orden común o federal cometidos por militares, siempre que el sujeto pasivo no sea civil y se cumplan los supuestos señalados en el propio artículo.", "source": "Manual, pág. 4"}, {"id": "norm-62", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ámbito internacional - Derecho Internacional Humanitario", "topic": "Ámbito internacional - Derecho Internacional Humanitario", "question": "¿Cuál es la finalidad del DIH respecto de los conflictos armados?", "answer": "No permite ni prohíbe los conflictos armados; establece lineamientos para humanizarlos y limitar sus efectos a lo estrictamente necesario.", "source": "Manual, pág. 4"}, {"id": "norm-63", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Ámbito internacional - Derecho Internacional Humanitario", "topic": "Ámbito internacional - Derecho Internacional Humanitario", "question": "¿Qué legitima la actuación del personal militar del Ejército y Fuerza Aérea Mexicanos en el ámbito internacional?", "answer": "El Marco Jurídico Internacional.", "source": "Manual, pág. 4"}, {"id": "norm-64", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Carta de las Naciones Unidas", "topic": "Carta de las Naciones Unidas", "question": "¿Qué garantiza la Carta de las Naciones Unidas?", "answer": "El mantenimiento de la paz mundial y la supresión de los actos de agresión entre los Estados.", "source": "Manual, pág. 4"}, {"id": "norm-65", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Carta de las Naciones Unidas", "topic": "Carta de las Naciones Unidas", "question": "¿En qué se basa la Carta de las Naciones Unidas?", "answer": "En la igualdad soberana de los Estados miembros, el cumplimiento de buena fe de sus obligaciones y la solución pacífica de los conflictos internacionales.", "source": "Manual, pág. 4"}, {"id": "norm-66", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Carta de las Naciones Unidas", "topic": "Carta de las Naciones Unidas", "question": "¿De qué se abstendrán los Estados miembros?", "answer": "De la amenaza o uso de la fuerza contra la integridad territorial o la independencia política de otro Estado.", "source": "Manual, pág. 4"}, {"id": "norm-67", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Carta de las Naciones Unidas", "topic": "Carta de las Naciones Unidas", "question": "¿Qué velará la Organización?", "answer": "Por el mantenimiento de la paz y la seguridad internacionales.", "source": "Manual, pág. 4"}, {"id": "norm-68", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Declaración Universal de los Derechos Humanos", "topic": "Declaración Universal de los Derechos Humanos", "question": "¿Cuándo y dónde fue adoptada?", "answer": "En Francia, el 10 de diciembre de 1948.", "source": "Manual, pág. 4"}, {"id": "norm-69", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Declaración Universal de los Derechos Humanos", "topic": "Declaración Universal de los Derechos Humanos", "question": "¿Cuándo fue ratificada por México según el manual?", "answer": "En 1948, ese mismo año.", "source": "Manual, pág. 4"}, {"id": "norm-70", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Declaración Universal de los Derechos Humanos", "topic": "Declaración Universal de los Derechos Humanos", "question": "¿Qué establece respecto de todos los seres humanos?", "answer": "Que nacen libres e iguales en dignidad y derechos, y deben comportarse con fraternidad.", "source": "Manual, pág. 4"}, {"id": "norm-71", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Pacto Internacional de Derechos Civiles y Políticos", "topic": "Pacto Internacional de Derechos Civiles y Políticos", "question": "Art. 1. ¿A qué tienen derecho todos los pueblos?", "answer": "A la libre determinación, a decidir su condición política y su desarrollo económico, social y cultural.", "source": "Manual, pág. 4"}, {"id": "norm-72", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Pacto Internacional de Derechos Civiles y Políticos", "topic": "Pacto Internacional de Derechos Civiles y Políticos", "question": "Art. 1. ¿De qué pueden disponer los pueblos?", "answer": "De sus riquezas y recursos naturales, sin que se les prive de sus medios de subsistencia.", "source": "Manual, pág. 4"}, {"id": "norm-73", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Pacto Internacional de Derechos Civiles y Políticos", "topic": "Pacto Internacional de Derechos Civiles y Políticos", "question": "Art. 1. ¿Qué promoverán los Estados Partes?", "answer": "El ejercicio del derecho de libre determinación.", "source": "Manual, pág. 4"}, {"id": "norm-74", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Pacto Internacional de Derechos Civiles y Políticos", "topic": "Pacto Internacional de Derechos Civiles y Políticos", "question": "Art. 2. ¿En qué situaciones pueden suspenderse obligaciones del Pacto y de qué forma?", "answer": "En situaciones excepcionales que pongan en peligro la vida de la nación; de forma estrictamente limitada y sin discriminación por raza, color, sexo, idioma, religión u origen social.", "source": "Manual, pág. 4"}, {"id": "norm-75", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Pacto Internacional de Derechos Civiles y Políticos", "topic": "Pacto Internacional de Derechos Civiles y Políticos", "question": "Art. 20. ¿Qué propaganda queda prohibida?", "answer": "La propaganda en favor de la guerra y la propaganda que incite al odio nacional, racial o religioso, a la discriminación, hostilidad o violencia.", "source": "Manual, pág. 4"}, {"id": "norm-76", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Pacto Internacional de Derechos Económicos, Sociales y Culturales", "topic": "Pacto Internacional de Derechos Económicos, Sociales y Culturales", "question": "¿Cuándo y dónde fue aprobado?", "answer": "El 16 de diciembre de 1966 en Nueva York, EUA.", "source": "Manual, pág. 4"}, {"id": "norm-77", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Pacto Internacional de Derechos Económicos, Sociales y Culturales", "topic": "Pacto Internacional de Derechos Económicos, Sociales y Culturales", "question": "¿Cuándo fue ratificado por México?", "answer": "El 23 de marzo de 1981.", "source": "Manual, pág. 4"}, {"id": "norm-78", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Pacto Internacional de Derechos Económicos, Sociales y Culturales", "topic": "Pacto Internacional de Derechos Económicos, Sociales y Culturales", "question": "Art. 1. ¿Conforme a qué pueden los pueblos disponer de sus riquezas y recursos naturales?", "answer": "Conforme al principio de beneficio recíproco y al Derecho Internacional.", "source": "Manual, pág. 4"}, {"id": "norm-79", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Pacto Internacional de Derechos Económicos, Sociales y Culturales", "topic": "Pacto Internacional de Derechos Económicos, Sociales y Culturales", "question": "Art. 4. ¿Con qué fin pueden los Estados Partes establecer limitaciones a los derechos?", "answer": "Únicamente por ley, cuando sean compatibles con la naturaleza de los derechos y tengan como fin el bienestar general en una sociedad democrática.", "source": "Manual, pág. 4"}, {"id": "norm-80", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Convención Americana sobre Derechos Humanos", "topic": "Convención Americana sobre Derechos Humanos", "question": "¿Cuándo y dónde fue aprobada?", "answer": "El 22 de noviembre de 1969 en Costa Rica.", "source": "Manual, pág. 4"}, {"id": "norm-81", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Convención Americana sobre Derechos Humanos", "topic": "Convención Americana sobre Derechos Humanos", "question": "¿Cuándo fue ratificada por México?", "answer": "El 3 de febrero de 1981.", "source": "Manual, pág. 4"}, {"id": "norm-82", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Convención Americana sobre Derechos Humanos", "topic": "Convención Americana sobre Derechos Humanos", "question": "¿Cuál es el objeto de la Convención?", "answer": "Establecer la obligación de los Estados miembros de respetar los derechos y libertades de toda persona.", "source": "Manual, pág. 4"}, {"id": "norm-83", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Convención Americana sobre Derechos Humanos", "topic": "Convención Americana sobre Derechos Humanos", "question": "¿Cuáles son los deberes de los Estados y derechos protegidos que resume el manual?", "answer": "Derechos civiles y políticos; derechos económicos, sociales y culturales; suspensión de garantías, interpretación y aplicación; y deberes de las personas.", "source": "Manual, pág. 4"}, {"id": "norm-84", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Convención Americana sobre Derechos Humanos", "topic": "Convención Americana sobre Derechos Humanos", "question": "¿Cuáles son los medios de protección que resume el manual?", "answer": "Órganos competentes, Comisión Interamericana de Derechos Humanos y Corte Interamericana de Derechos Humanos.", "source": "Manual, pág. 4"}, {"id": "norm-85", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Carta de la Organización de los Estados Americanos (OEA)", "topic": "Carta de la Organización de los Estados Americanos (OEA)", "question": "¿Cuándo fue aprobada y cuándo fue ratificada por México?", "answer": "Fue aprobada el 30 de abril de 1948 en Colombia y ratificada por México el 23 de noviembre del mismo año.", "source": "Manual, pág. 5"}, {"id": "norm-86", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Carta de la Organización de los Estados Americanos (OEA)", "topic": "Carta de la Organización de los Estados Americanos (OEA)", "question": "Art. 1. ¿Qué y para qué crean los Estados Americanos?", "answer": "Crean la OEA para mantener la paz, la justicia, la solidaridad y la colaboración, y defender la soberanía, integridad territorial e independencia de los Estados.", "source": "Manual, pág. 5"}, {"id": "norm-87", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Carta de la Organización de los Estados Americanos (OEA)", "topic": "Carta de la Organización de los Estados Americanos (OEA)", "question": "Art. 3. ¿En qué se basa el orden internacional?", "answer": "En el respeto a la soberanía, la independencia y al Derecho Internacional.", "source": "Manual, pág. 5"}, {"id": "norm-88", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Carta de la Organización de los Estados Americanos (OEA)", "topic": "Carta de la Organización de los Estados Americanos (OEA)", "question": "Art. 3. ¿A qué tiene derecho cada Estado?", "answer": "A elegir su sistema político, económico y social sin injerencias externas, con el deber de no intervenir en los asuntos de otro Estado.", "source": "Manual, pág. 5"}, {"id": "norm-89", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Carta de la Organización de los Estados Americanos (OEA)", "topic": "Carta de la Organización de los Estados Americanos (OEA)", "question": "Art. 3. ¿Qué condenan los Estados Americanos?", "answer": "La guerra de agresión.", "source": "Manual, pág. 5"}, {"id": "norm-90", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Carta de la Organización de los Estados Americanos (OEA)", "topic": "Carta de la Organización de los Estados Americanos (OEA)", "question": "Art. 3. ¿Cómo deben resolverse las controversias internacionales?", "answer": "Por procedimientos pacíficos.", "source": "Manual, pág. 5"}, {"id": "norm-91", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Carta de la Organización de los Estados Americanos (OEA)", "topic": "Carta de la Organización de los Estados Americanos (OEA)", "question": "Art. 22. ¿En qué casos pueden los Estados Americanos recurrir al uso de la fuerza?", "answer": "Solo en caso de legítima defensa, conforme a los tratados vigentes.", "source": "Manual, pág. 5"}, {"id": "norm-92", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Convenios de Ginebra de 1949", "topic": "Convenios de Ginebra de 1949", "question": "¿Dónde fueron celebrados y cuándo fueron ratificados por México?", "answer": "En Ginebra, Suiza, en 1949; México los ratificó el 29 de octubre de 1952.", "source": "Manual, pág. 5"}, {"id": "norm-93", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Convenios de Ginebra de 1949", "topic": "Convenios de Ginebra de 1949", "question": "¿En qué se basan los Convenios de Ginebra?", "answer": "En el respeto a la persona humana y su dignidad.", "source": "Manual, pág. 5"}, {"id": "norm-94", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Convenios de Ginebra de 1949", "topic": "Convenios de Ginebra de 1949", "question": "¿Cuándo deja una persona de ser enemiga y qué requiere?", "answer": "Cuando está herida, prisionera o náufraga; pasa a ser una persona que requiere protección.", "source": "Manual, pág. 5"}, {"id": "norm-95", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Convenios de Ginebra de 1949", "topic": "Convenios de Ginebra de 1949", "question": "¿Para qué es el Primer Convenio?", "answer": "Para aliviar la suerte de los heridos y enfermos de las fuerzas armadas en campaña.", "source": "Manual, pág. 5"}, {"id": "norm-96", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Convenios de Ginebra de 1949", "topic": "Convenios de Ginebra de 1949", "question": "¿Para qué es el Segundo Convenio?", "answer": "Para aliviar la suerte de los heridos, enfermos y náufragos de las fuerzas armadas en el mar.", "source": "Manual, pág. 5"}, {"id": "norm-97", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Convenios de Ginebra de 1949", "topic": "Convenios de Ginebra de 1949", "question": "¿Para qué es el Tercer Convenio?", "answer": "Para regular el trato de los prisioneros de guerra.", "source": "Manual, pág. 5"}, {"id": "norm-98", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Convenios de Ginebra de 1949", "topic": "Convenios de Ginebra de 1949", "question": "¿Para qué es el Cuarto Convenio?", "answer": "Para proteger a las personas civiles en tiempo de guerra.", "source": "Manual, pág. 5"}, {"id": "norm-99", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Protocolos Adicionales a los Convenios de Ginebra", "topic": "Protocolos Adicionales a los Convenios de Ginebra", "question": "¿Qué refuerzan y qué establecen los Protocolos Adicionales?", "answer": "Refuerzan la protección de las víctimas de los conflictos armados y establecen límites a la conducción de las operaciones militares.", "source": "Manual, pág. 5"}, {"id": "norm-100", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Protocolos Adicionales a los Convenios de Ginebra", "topic": "Protocolos Adicionales a los Convenios de Ginebra", "question": "¿A qué es relativo el Primer Protocolo Adicional?", "answer": "A la protección de las víctimas de los conflictos armados internacionales.", "source": "Manual, pág. 5"}, {"id": "norm-101", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Protocolos Adicionales a los Convenios de Ginebra", "topic": "Protocolos Adicionales a los Convenios de Ginebra", "question": "¿Cuándo fue ratificado por México el Primer Protocolo?", "answer": "El 10 de marzo de 1983.", "source": "Manual, pág. 5"}, {"id": "norm-102", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Protocolos Adicionales a los Convenios de Ginebra", "topic": "Protocolos Adicionales a los Convenios de Ginebra", "question": "¿Qué define el Primer Protocolo?", "answer": "Las normas de Derecho Internacional aplicables a los conflictos armados.", "source": "Manual, pág. 5"}, {"id": "norm-103", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Protocolos Adicionales a los Convenios de Ginebra", "topic": "Protocolos Adicionales a los Convenios de Ginebra", "question": "¿Qué impone el Primer Protocolo?", "answer": "Límites a la conducción de las operaciones militares y a los medios de guerra.", "source": "Manual, pág. 5"}, {"id": "norm-104", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Protocolos Adicionales a los Convenios de Ginebra", "topic": "Protocolos Adicionales a los Convenios de Ginebra", "question": "¿Qué limita y establece el Primer Protocolo?", "answer": "Limita la actuación de los Estados durante el combate y establece los objetivos militares.", "source": "Manual, pág. 5"}, {"id": "norm-105", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Protocolos Adicionales a los Convenios de Ginebra", "topic": "Protocolos Adicionales a los Convenios de Ginebra", "question": "¿A qué se limitan los objetivos militares?", "answer": "A objetos que contribuyen eficazmente a la acción militar o cuya destrucción ofrece una ventaja militar definida.", "source": "Manual, pág. 5"}, {"id": "norm-106", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Protocolos Adicionales a los Convenios de Ginebra", "topic": "Protocolos Adicionales a los Convenios de Ginebra", "question": "¿A qué es relativo el Segundo Protocolo Adicional?", "answer": "A la protección de las víctimas de los conflictos armados no internacionales.", "source": "Manual, pág. 5"}, {"id": "norm-107", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Protocolos Adicionales a los Convenios de Ginebra", "topic": "Protocolos Adicionales a los Convenios de Ginebra", "question": "¿Qué regula el Segundo Protocolo?", "answer": "Los conflictos internos y reconoce a los grupos beligerantes.", "source": "Manual, pág. 6"}, {"id": "norm-108", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Protocolos Adicionales a los Convenios de Ginebra", "topic": "Protocolos Adicionales a los Convenios de Ginebra", "question": "¿Es aplicable en México el Segundo Protocolo según el manual?", "answer": "No. El manual señala que México no lo ha ratificado.", "source": "Manual, pág. 6"}, {"id": "norm-109", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Protocolos Adicionales a los Convenios de Ginebra", "topic": "Protocolos Adicionales a los Convenios de Ginebra", "question": "¿Cuándo fue aprobado y ratificado por México el Tercer Protocolo?", "answer": "Fue aprobado en 2005 y ratificado por México en 2008.", "source": "Manual, pág. 6"}, {"id": "norm-110", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Protocolos Adicionales a los Convenios de Ginebra", "topic": "Protocolos Adicionales a los Convenios de Ginebra", "question": "¿Qué reconoce el Tercer Protocolo?", "answer": "Los emblemas de la Cruz Roja, Media Luna Roja y León y Sol Rojos con el mismo estatus.", "source": "Manual, pág. 6"}, {"id": "norm-111", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Protocolos Adicionales a los Convenios de Ginebra", "topic": "Protocolos Adicionales a los Convenios de Ginebra", "question": "¿Qué emblema adicional establece el Tercer Protocolo?", "answer": "Un marco rojo cuadrado sobre fondo blanco, denominado Emblema del Tercer Protocolo.", "source": "Manual, pág. 6"}, {"id": "norm-112", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Derechos de La Haya o Derechos de Guerra", "topic": "Derechos de La Haya o Derechos de Guerra", "question": "¿Qué son los Derechos de La Haya?", "answer": "Un conjunto de normas internacionales que limitan los métodos y medios de combate para hacer los conflictos armados menos crueles.", "source": "Manual, pág. 6"}, {"id": "norm-113", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Derechos de La Haya o Derechos de Guerra", "topic": "Derechos de La Haya o Derechos de Guerra", "question": "¿Qué limitan y prohíben?", "answer": "Limitan los métodos y medios de combate y prohíben, entre otras cosas, el terror, represalias contra personas protegidas, balas dum-dum y armas incendiarias.", "source": "Manual, pág. 6"}, {"id": "norm-114", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Derechos de La Haya o Derechos de Guerra", "topic": "Derechos de La Haya o Derechos de Guerra", "question": "¿Qué buscan evitar?", "answer": "Sufrimientos innecesarios y daños superfluos.", "source": "Manual, pág. 6"}, {"id": "norm-115", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Derechos de La Haya o Derechos de Guerra", "topic": "Derechos de La Haya o Derechos de Guerra", "question": "¿Qué prohíbe la Declaración de San Petersburgo de 1868?", "answer": "Proyectiles menores de 400 gramos con materiales explosivos e inflamables.", "source": "Manual, pág. 6"}, {"id": "norm-116", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Derechos de La Haya o Derechos de Guerra", "topic": "Derechos de La Haya o Derechos de Guerra", "question": "¿Qué prohíbe la Declaración de La Haya de 1899?", "answer": "Las balas que se hinchan o aplastan el cuerpo humano.", "source": "Manual, pág. 6"}, {"id": "norm-117", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Derechos de La Haya o Derechos de Guerra", "topic": "Derechos de La Haya o Derechos de Guerra", "question": "¿Qué instrumentos prohíben gases asfixiantes, tóxicos o similares y medios bacteriológicos?", "answer": "La Convención de La Haya de 1907 y el Protocolo de Ginebra de 1925.", "source": "Manual, pág. 6"}, {"id": "norm-118", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Derechos de La Haya o Derechos de Guerra", "topic": "Derechos de La Haya o Derechos de Guerra", "question": "¿Qué prohíbe la Convención de 1972?", "answer": "El desarrollo, producción y almacenamiento de armas bacteriológicas y toxínicas.", "source": "Manual, pág. 6"}, {"id": "norm-119", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Derechos de La Haya o Derechos de Guerra", "topic": "Derechos de La Haya o Derechos de Guerra", "question": "¿Cuándo fue aprobada la Convención de 1980 y cuándo la ratificó México?", "answer": "Fue aprobada en Ginebra el 10 de octubre de 1980 y ratificada por México el 11 de febrero de 1982.", "source": "Manual, pág. 6"}, {"id": "norm-120", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Derechos de La Haya o Derechos de Guerra", "topic": "Derechos de La Haya o Derechos de Guerra", "question": "¿Qué establece la Convención de 1980?", "answer": "Restricciones y prohibiciones sobre armas convencionales que causen daños superfluos o sufrimientos innecesarios.", "source": "Manual, pág. 6"}, {"id": "norm-121", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Derechos de La Haya o Derechos de Guerra", "topic": "Derechos de La Haya o Derechos de Guerra", "question": "¿Qué prohíbe el Protocolo I de la Convención de 1980?", "answer": "Armas de fragmentación no localizable por rayos X.", "source": "Manual, pág. 6"}, {"id": "norm-122", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Derechos de La Haya o Derechos de Guerra", "topic": "Derechos de La Haya o Derechos de Guerra", "question": "¿Qué regula el Protocolo II de la Convención de 1980?", "answer": "Minas terrestres, armas trampa y otros artefactos.", "source": "Manual, pág. 6"}, {"id": "norm-123", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Derechos de La Haya o Derechos de Guerra", "topic": "Derechos de La Haya o Derechos de Guerra", "question": "¿Qué limita el Protocolo III de la Convención de 1980?", "answer": "Las armas incendiarias y prohíbe atacar a personas civiles.", "source": "Manual, pág. 6"}, {"id": "norm-124", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Derechos de La Haya o Derechos de Guerra", "topic": "Derechos de La Haya o Derechos de Guerra", "question": "¿Qué prohíbe el Protocolo IV de la Convención de 1980?", "answer": "Armas láser diseñadas para causar ceguera permanente.", "source": "Manual, pág. 6"}, {"id": "norm-125", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Derechos de La Haya o Derechos de Guerra", "topic": "Derechos de La Haya o Derechos de Guerra", "question": "¿Qué regula el Protocolo V de la Convención de 1980?", "answer": "La limpieza, remoción y destrucción de artefactos explosivos sin estallar, así como el registro y transmisión de información.", "source": "Manual, pág. 6"}, {"id": "norm-126", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Derechos de La Haya o Derechos de Guerra", "topic": "Derechos de La Haya o Derechos de Guerra", "question": "¿Qué prohíbe la Convención de 1993?", "answer": "El desarrollo, producción, almacenamiento y empleo de armas químicas.", "source": "Manual, pág. 6"}, {"id": "norm-127", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Derechos de La Haya o Derechos de Guerra", "topic": "Derechos de La Haya o Derechos de Guerra", "question": "¿Cuándo fue aprobada la Convención sobre Municiones en Racimo y cuándo la ratificó México?", "answer": "Fue aprobada el 30 de mayo de 2008 y ratificada por México el 16 de abril de 2009.", "source": "Manual, pág. 6"}, {"id": "norm-128", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Derechos de La Haya o Derechos de Guerra", "topic": "Derechos de La Haya o Derechos de Guerra", "question": "Art. 1 de la Convención sobre Municiones en Racimo. ¿A qué se compromete cada Estado Parte?", "answer": "A nunca emplear municiones en racimo ni desarrollarlas, producirlas, adquirirlas, almacenarlas, conservarlas o transferirlas.", "source": "Manual, pág. 6"}, {"id": "norm-129", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Derechos de La Haya o Derechos de Guerra", "topic": "Derechos de La Haya o Derechos de Guerra", "question": "Art. 2. ¿Qué es una munición en racimo?", "answer": "Munición convencional diseñada para dispersar o liberar submuniciones explosivas.", "source": "Manual, pág. 6"}, {"id": "norm-130", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Reglamento relativo a las leyes y costumbres de la guerra terrestre", "topic": "Reglamento relativo a las leyes y costumbres de la guerra terrestre", "question": "¿Dónde y cuándo fue aprobado este Reglamento?", "answer": "En La Haya, Países Bajos, el 18 de octubre de 1907.", "source": "Manual, pág. 6"}, {"id": "norm-131", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Reglamento relativo a las leyes y costumbres de la guerra terrestre", "topic": "Reglamento relativo a las leyes y costumbres de la guerra terrestre", "question": "¿A quiénes considera beligerantes?", "answer": "No solo a los ejércitos, sino también a las milicias y cuerpos voluntarios, bajo condiciones específicas.", "source": "Manual, pág. 6"}, {"id": "norm-132", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Reglamento relativo a las leyes y costumbres de la guerra terrestre", "topic": "Reglamento relativo a las leyes y costumbres de la guerra terrestre", "question": "¿Qué regula el Reglamento?", "answer": "Los medios de hacer la guerra, los sitios, bombardeos, espías, parlamentarios, capitulaciones y el armisticio.", "source": "Manual, pág. 6"}, {"id": "norm-133", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Reglamento relativo a las leyes y costumbres de la guerra terrestre", "topic": "Reglamento relativo a las leyes y costumbres de la guerra terrestre", "question": "¿Qué se considera territorio ocupado?", "answer": "El territorio que esté bajo la autoridad del ejército enemigo.", "source": "Manual, pág. 6"}, {"id": "norm-134", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Reglamento relativo a las leyes y costumbres de la guerra terrestre", "topic": "Reglamento relativo a las leyes y costumbres de la guerra terrestre", "question": "¿Qué debe ser respetado?", "answer": "El honor y los derechos de la familia.", "source": "Manual, pág. 6"}, {"id": "norm-135", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Reglamento relativo a las leyes y costumbres de la guerra terrestre", "topic": "Reglamento relativo a las leyes y costumbres de la guerra terrestre", "question": "¿De qué puede apoderarse el ejército ocupante?", "answer": "Del dinero, fondos, obligaciones por cobrar y bienes del Estado que sirvan para operaciones militares.", "source": "Manual, pág. 6"}, {"id": "norm-136", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Reglamento relativo a las leyes y costumbres de la guerra terrestre", "topic": "Reglamento relativo a las leyes y costumbres de la guerra terrestre", "question": "¿Qué medios pueden ser tomados y qué debe ocurrir al restablecerse la paz?", "answer": "Los medios de tierra, mar y aire destinados a transmitir noticias o al transporte pueden ser tomados, pero deben ser restituidos e indemnizados al restablecerse la paz.", "source": "Manual, pág. 6"}, {"id": "norm-137", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Reglamento relativo a las leyes y costumbres de la guerra terrestre", "topic": "Reglamento relativo a las leyes y costumbres de la guerra terrestre", "question": "¿Cómo serán tratados los bienes comunales y establecimientos de culto, caridad, instrucción, artes y ciencias?", "answer": "Como propiedad privada.", "source": "Manual, pág. 6"}, {"id": "norm-138", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Reglamento relativo a las leyes y costumbres de la guerra terrestre", "topic": "Reglamento relativo a las leyes y costumbres de la guerra terrestre", "question": "¿Qué se prohíbe respecto de monumentos históricos, obras de arte y científicas?", "answer": "Su apropiación, destrucción o daño.", "source": "Manual, pág. 6"}, {"id": "norm-139", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Estatuto de Roma de la Corte Penal Internacional", "topic": "Estatuto de Roma de la Corte Penal Internacional", "question": "¿En qué año fue firmado y cuándo fue ratificado por México?", "answer": "Fue firmado en 2000 y ratificado por México en 2005.", "source": "Manual, pág. 7"}, {"id": "norm-140", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Estatuto de Roma de la Corte Penal Internacional", "topic": "Estatuto de Roma de la Corte Penal Internacional", "question": "¿Qué establece el Estatuto respecto de la Corte Penal Internacional?", "answer": "La establece como un organismo permanente y complementario de los tribunales penales nacionales.", "source": "Manual, pág. 7"}, {"id": "norm-141", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Estatuto de Roma de la Corte Penal Internacional", "topic": "Estatuto de Roma de la Corte Penal Internacional", "question": "¿Qué afirma respecto de los crímenes más graves?", "answer": "Que los crímenes más graves de trascendencia para la comunidad internacional no deben quedar sin castigo.", "source": "Manual, pág. 7"}, {"id": "norm-142", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Estatuto de Roma de la Corte Penal Internacional", "topic": "Estatuto de Roma de la Corte Penal Internacional", "question": "¿Qué propósitos y principios de la Carta de la ONU reafirma?", "answer": "Especialmente la prohibición de la amenaza o el uso de la fuerza contra la integridad territorial o la independencia política de cualquier Estado.", "source": "Manual, pág. 7"}, {"id": "norm-143", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Estatuto de Roma de la Corte Penal Internacional", "topic": "Estatuto de Roma de la Corte Penal Internacional", "question": "¿Sobre qué crímenes tiene competencia la Corte Penal Internacional?", "answer": "Genocidio, lesa humanidad, crímenes de guerra y crimen de agresión.", "source": "Manual, pág. 7"}, {"id": "norm-144", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Derecho Operacional y Asesores Jurídico Operacionales (ASJOPER)", "topic": "Derecho Operacional y Asesores Jurídico Operacionales (ASJOPER)", "question": "¿Qué regula el Derecho Operacional?", "answer": "El cumplimiento de las misiones conforme al marco legal vigente.", "source": "Manual, pág. 7"}, {"id": "norm-145", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Derecho Operacional y Asesores Jurídico Operacionales (ASJOPER)", "topic": "Derecho Operacional y Asesores Jurídico Operacionales (ASJOPER)", "question": "¿De acuerdo con qué regula la conducción de hostilidades, misiones militares y el uso de la fuerza?", "answer": "De acuerdo con el Entorno Operacional (OE) y el orden público.", "source": "Manual, pág. 7"}, {"id": "norm-146", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Derecho Operacional y Asesores Jurídico Operacionales (ASJOPER)", "topic": "Derecho Operacional y Asesores Jurídico Operacionales (ASJOPER)", "question": "¿Para qué está diseñado el Derecho Operacional?", "answer": "No está diseñado para evitar operar, sino para cumplir los deberes constitucionales.", "source": "Manual, pág. 7"}, {"id": "norm-147", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Derecho Operacional y Asesores Jurídico Operacionales (ASJOPER)", "topic": "Derecho Operacional y Asesores Jurídico Operacionales (ASJOPER)", "question": "¿De quién requiere participación la actuación de las operaciones militares?", "answer": "Del Asesor Jurídico Operacional (ASJOPER).", "source": "Manual, pág. 7"}, {"id": "norm-148", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Derecho Operacional y Asesores Jurídico Operacionales (ASJOPER)", "topic": "Derecho Operacional y Asesores Jurídico Operacionales (ASJOPER)", "question": "¿Qué contempla el artículo 82 del Protocolo Adicional a los Convenios de Ginebra de 1949?", "answer": "La figura del asesor jurídico durante las operaciones militares.", "source": "Manual, pág. 7"}, {"id": "norm-149", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Derecho Operacional y Asesores Jurídico Operacionales (ASJOPER)", "topic": "Derecho Operacional y Asesores Jurídico Operacionales (ASJOPER)", "question": "¿Con qué deberán contar las Altas Partes Contratantes y las partes en conflicto armado?", "answer": "Con asesores jurídicos para asesorar a los comandantes militares.", "source": "Manual, pág. 7"}, {"id": "norm-150", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Derecho Operacional y Asesores Jurídico Operacionales (ASJOPER)", "topic": "Derecho Operacional y Asesores Jurídico Operacionales (ASJOPER)", "question": "¿Qué es un ASJOPER?", "answer": "Un profesional del derecho que asesora al comandante y contribuye a la legitimidad de las Fuerzas Militares.", "source": "Manual, pág. 7"}, {"id": "norm-151", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Derecho Operacional y Asesores Jurídico Operacionales (ASJOPER)", "topic": "Derecho Operacional y Asesores Jurídico Operacionales (ASJOPER)", "question": "¿Cómo debe ser su asesoría y qué debe proporcionar?", "answer": "Debe ser integral y proporcionar al comandante herramientas para tomar decisiones conforme a los preceptos legales y constitucionales.", "source": "Manual, pág. 7"}, {"id": "norm-152", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Derecho Operacional y Asesores Jurídico Operacionales (ASJOPER)", "topic": "Derecho Operacional y Asesores Jurídico Operacionales (ASJOPER)", "question": "¿Qué debe ser un ASJOPER y qué conocimientos debe tener?", "answer": "Un abogado militar en servicio activo, con conocimientos en Derecho Constitucional, DIH, DIDH, Doctrina Jurídica Operacional, Derecho Administrativo, Derecho Penal, Derecho Penal Militar, Sistema Penal Acusatorio y Criminalística.", "source": "Manual, pág. 7"}, {"id": "norm-153", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Derecho Operacional y Asesores Jurídico Operacionales (ASJOPER)", "topic": "Derecho Operacional y Asesores Jurídico Operacionales (ASJOPER)", "question": "¿A quién asesora el ASJOPER?", "answer": "Al comandante.", "source": "Manual, pág. 7"}, {"id": "norm-154", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Derecho Operacional y Asesores Jurídico Operacionales (ASJOPER)", "topic": "Derecho Operacional y Asesores Jurídico Operacionales (ASJOPER)", "question": "¿Qué fortalece el ASJOPER?", "answer": "La acción jurídica en las operaciones militares.", "source": "Manual, pág. 7"}, {"id": "norm-155", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Derecho Operacional y Asesores Jurídico Operacionales (ASJOPER)", "topic": "Derecho Operacional y Asesores Jurídico Operacionales (ASJOPER)", "question": "¿En qué trámites coadyuva el ASJOPER?", "answer": "En el trámite de quejas, denuncias, infracciones al DIH y violaciones al DIDH.", "source": "Manual, pág. 7"}, {"id": "today-156", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Segunda Sección · Marco Teórico", "topic": "Segunda Sección · Marco Teórico", "question": "¿En qué se basa el Marco Teórico del manual?", "answer": "En la bibliografía militar nacional y la doctrina de la OTAN, considerando fuentes de países que han adaptado su doctrina.", "source": "Manual actual, Segunda Sección"}, {"id": "today-157", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Segunda Sección · Marco Teórico", "topic": "Segunda Sección · Marco Teórico", "question": "¿Qué países toma como referencia el manual para adaptar su doctrina?", "answer": "Estados Unidos, Reino Unido, Francia, España, Colombia, Argentina y Brasil.", "source": "Manual actual, Segunda Sección"}, {"id": "today-158", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Segunda Sección · Marco Teórico", "topic": "Segunda Sección · Marco Teórico", "question": "¿Qué significa que la información fue tropicalizada?", "answer": "Que fue adaptada con la participación de organismos del Ejército y Fuerza Aérea, conforme al marco legal y al principio de legitimidad.", "source": "Manual actual, Segunda Sección"}, {"id": "today-159", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Segunda Sección · Marco Teórico", "topic": "Segunda Sección · Marco Teórico", "question": "¿Qué publicaciones doctrinales fueron consultadas?", "answer": "Publicaciones Aliadas Conjuntas (AJP) de la OTAN; Publicaciones de Doctrina Conjunta (JDP) del Reino Unido; Publicaciones Conjuntas (JP) de Estados Unidos; Publicaciones de Doctrina del Ejército de Norteamérica (ADP); Manuales de Campo (FM); Manuales de Doctrina de las Fuerzas Armadas de Colombia; y publicaciones y manuales de la SEDENA.", "source": "Manual actual, Segunda Sección"}, {"id": "today-160", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Segunda Sección · Marco Teórico", "topic": "Segunda Sección · Marco Teórico", "question": "¿Para qué se toma como base esta bibliografía militar nacional y doctrina internacional?", "answer": "Para la participación en cursos, ejercicios internacionales y misiones de paz.", "source": "Manual actual, Segunda Sección"}, {"id": "today-161", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Tercera Sección · Marco Conceptual · Pensamiento Crítico", "topic": "Tercera Sección · Marco Conceptual · Pensamiento Crítico", "question": "¿Cómo define el LISA Institute el pensamiento crítico?", "answer": "Como la capacidad del ser humano para analizar una información ya existente con el objetivo de esclarecer su veracidad y alcanzar una idea justificada.", "source": "Manual físico, párr. 40"}, {"id": "today-162", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Tercera Sección · Marco Conceptual · Pensamiento Crítico", "topic": "Tercera Sección · Marco Conceptual · Pensamiento Crítico", "question": "¿Cuál es el objetivo del pensamiento crítico según el LISA Institute?", "answer": "Esclarecer la veracidad de la información y alcanzar una idea justificada.", "source": "Manual físico, párr. 40"}, {"id": "today-163", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Tercera Sección · Marco Conceptual · Pensamiento Crítico", "topic": "Tercera Sección · Marco Conceptual · Pensamiento Crítico", "question": "¿Cómo define la Universidad Anáhuac el pensamiento crítico?", "answer": "Como la capacidad que tenemos para analizar la información que recibimos.", "source": "Manual físico, párr. 40"}, {"id": "today-164", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Tercera Sección · Marco Conceptual · Pensamiento Crítico", "topic": "Tercera Sección · Marco Conceptual · Pensamiento Crítico", "question": "¿Qué publicación se utiliza para enriquecer las definiciones anteriores?", "answer": "La publicación de Técnicas del Ejército Estadounidense Metodología de Diseño del Ejército (ADM).", "source": "Manual físico, párr. 41"}, {"id": "today-165", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Tercera Sección · Marco Conceptual · Pensamiento Crítico", "topic": "Tercera Sección · Marco Conceptual · Pensamiento Crítico", "question": "¿Cómo define el ADM el pensamiento crítico?", "answer": "Como un pensamiento decidido y reflexivo sobre qué creer o qué hacer en respuesta a observaciones, experiencias, expresiones o argumentos verbales o escritos.", "source": "Manual físico, párr. 42"}, {"id": "today-166", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Tercera Sección · Marco Conceptual · Pensamiento Crítico", "topic": "Tercera Sección · Marco Conceptual · Pensamiento Crítico", "question": "¿Qué implica el pensamiento crítico?", "answer": "Cuestionar información, suposiciones, conclusiones y puntos de vista para interpretar datos e información, evaluar evidencia y aclarar objetivos.", "source": "Manual físico, párr. 42"}, {"id": "today-167", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Tercera Sección · Marco Conceptual · Pensamiento Crítico", "topic": "Tercera Sección · Marco Conceptual · Pensamiento Crítico", "question": "¿A quién ayuda el pensamiento crítico?", "answer": "A los Comandantes y al Estado Mayor.", "source": "Manual físico, párr. 42"}, {"id": "today-168", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Tercera Sección · Marco Conceptual · Pensamiento Crítico", "topic": "Tercera Sección · Marco Conceptual · Pensamiento Crítico", "question": "¿En qué ayuda el pensamiento crítico a los Comandantes y al Estado Mayor?", "answer": "A comprender situaciones, identificar causas de problemas, llegar a conclusiones justificables y emitir buenos juicios.", "source": "Manual físico, párr. 42"}, {"id": "today-169", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Tercera Sección · Marco Conceptual · Pensamiento Creativo", "topic": "Tercera Sección · Marco Conceptual · Pensamiento Creativo", "question": "¿Cómo define The Innovation Factory Institute el pensamiento creativo?", "answer": "Como la capacidad de abordar un problema o reto desde una nueva perspectiva, un ángulo alternativo o con una mentalidad atípica.", "source": "Manual físico, Pensamiento Creativo"}, {"id": "today-170", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Tercera Sección · Marco Conceptual · Pensamiento Creativo", "topic": "Tercera Sección · Marco Conceptual · Pensamiento Creativo", "question": "¿Cómo expone el ADM el pensamiento creativo?", "answer": "Examina los problemas desde una nueva perspectiva para desarrollar soluciones innovadoras.", "source": "Manual físico, Pensamiento Creativo"}, {"id": "today-171", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Tercera Sección · Marco Conceptual · Pensamiento Creativo", "topic": "Tercera Sección · Marco Conceptual · Pensamiento Creativo", "question": "¿Qué crea el pensamiento creativo?", "answer": "Ideas nuevas y útiles, y reevalúa o combina ideas antiguas para resolver problemas.", "source": "Manual físico, Pensamiento Creativo"}, {"id": "today-172", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Tercera Sección · Marco Conceptual · Pensamiento Creativo", "topic": "Tercera Sección · Marco Conceptual · Pensamiento Creativo", "question": "¿Qué debe encontrar el personal de líderes?", "answer": "Soluciones novedosas a desafíos desconocidos o no estructurados.", "source": "Manual físico, Pensamiento Creativo"}, {"id": "today-173", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Tercera Sección · Marco Conceptual · Pensamiento Creativo", "topic": "Tercera Sección · Marco Conceptual · Pensamiento Creativo", "question": "¿Qué requiere el pensamiento creativo?", "answer": "Imaginación, una mente abierta a conceptos y oportunidades novedosos y disposición a aceptar el cambio.", "source": "Manual físico, Pensamiento Creativo"}, {"id": "today-174", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Tercera Sección · Marco Conceptual · Iniciativa Disciplinada", "topic": "Tercera Sección · Marco Conceptual · Iniciativa Disciplinada", "question": "¿Cómo define la Publicación de Doctrina de la Fuerza Aérea estadounidense la Iniciativa Disciplinada?", "answer": "Como la aplicación proactiva de inventiva y creatividad cuando las órdenes existentes ya no se ajustan a la situación o surgen amenazas u oportunidades imprevistas.", "source": "Manual físico, párr. 46"}, {"id": "today-175", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Tercera Sección · Marco Conceptual · Iniciativa Disciplinada", "topic": "Tercera Sección · Marco Conceptual · Iniciativa Disciplinada", "question": "¿Qué requiere la adopción de la Iniciativa Disciplinada?", "answer": "Una comprensión clara de los objetivos de la misión, los efectos deseados, la intención general del comandante y el contexto estratégico más amplio.", "source": "Manual físico, párr. 46"}, {"id": "today-176", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Tercera Sección · Marco Conceptual · Iniciativa Disciplinada", "topic": "Tercera Sección · Marco Conceptual · Iniciativa Disciplinada", "question": "¿Cómo define la ADP 6-0 la Iniciativa Disciplinada?", "answer": "Los subordinados siguen las órdenes y se adhieren al plan hasta darse cuenta de que ya no son adecuados para la situación; entonces toman medidas por iniciativa propia para ajustarse a la nueva situación y lograr la intención de su comandante.", "source": "Manual físico, párr. 47"}, {"id": "today-177", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Tercera Sección · Marco Conceptual · Iniciativa Disciplinada", "topic": "Tercera Sección · Marco Conceptual · Iniciativa Disciplinada", "question": "¿Qué implica la Iniciativa Disciplinada?", "answer": "Tomar acción cuando no hay órdenes disponibles, cuando las órdenes actuales ya no son adecuadas o cuando surgen oportunidades o amenazas imprevistas.", "source": "Manual físico, párr. 48"}, {"id": "today-178", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Tercera Sección · Marco Conceptual · Iniciativa Disciplinada", "topic": "Tercera Sección · Marco Conceptual · Iniciativa Disciplinada", "question": "¿Quiénes emplean la Iniciativa Disciplinada para generar oportunidades?", "answer": "Líderes y personal subordinado.", "source": "Manual físico, párr. 48"}, {"id": "today-179", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Tercera Sección · Marco Conceptual · Iniciativa Disciplinada", "topic": "Tercera Sección · Marco Conceptual · Iniciativa Disciplinada", "question": "¿En qué confían las y los Comandantes respecto del personal subordinado?", "answer": "En que el personal subordinado actúe mientras toma medidas para entender y desarrollar la situación.", "source": "Manual físico, párr. 49"}, {"id": "today-180", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Tercera Sección · Marco Conceptual · Iniciativa Disciplinada", "topic": "Tercera Sección · Marco Conceptual · Iniciativa Disciplinada", "question": "¿A qué contribuye la disposición de tomar la iniciativa?", "answer": "Al desarrollo y mantenimiento de la iniciativa operativa.", "source": "Manual físico, párr. 49"}, {"id": "today-181", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Tercera Sección · Marco Conceptual · Iniciativa Disciplinada", "topic": "Tercera Sección · Marco Conceptual · Iniciativa Disciplinada", "question": "¿Qué establece la intención de quien se desempeña como Comandante?", "answer": "Los límites dentro de los cuales los subordinados pueden ejercer la iniciativa.", "source": "Manual físico, párr. 50"}, {"id": "today-182", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Tercera Sección · Marco Conceptual · Iniciativa Disciplinada", "topic": "Tercera Sección · Marco Conceptual · Iniciativa Disciplinada", "question": "¿Qué proporciona la intención del Comandante a los subordinados?", "answer": "La confianza necesaria para aplicar su juicio en situaciones ambiguas y urgentes.", "source": "Manual físico, párr. 50"}, {"id": "today-183", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Tercera Sección · Marco Conceptual · Iniciativa Disciplinada", "topic": "Tercera Sección · Marco Conceptual · Iniciativa Disciplinada", "question": "¿Qué les permite hacer a los subordinados la Iniciativa Disciplinada?", "answer": "Tomar acciones que crean oportunidades para abordar problemas no anticipados.", "source": "Manual físico, párr. 51"}, {"id": "today-184", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Tercera Sección · Marco Conceptual · Ritmo de Batalla", "topic": "Tercera Sección · Marco Conceptual · Ritmo de Batalla", "question": "Según el Diccionario de Términos Militares del Departamento de Defensa Estadounidense, ¿qué es el Ritmo de Batalla?", "answer": "El programa diario deliberado de las actividades del mando, personal y unidad, destinado a maximizar el uso del tiempo y sincronizar sus acciones.", "source": "Manual físico, párr. 52"}, {"id": "today-185", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Tercera Sección · Marco Conceptual · Ritmo de Batalla", "topic": "Tercera Sección · Marco Conceptual · Ritmo de Batalla", "question": "¿Qué proporciona el Ritmo de Batalla?", "answer": "Estructura y una secuencia ordenada de acciones y eventos dentro del Cuartel General, regulada por el flujo de la información que respalda el ciclo de toma de decisiones.", "source": "Manual físico, párr. 53"}, {"id": "today-186", "chapter": "Capítulo I · Marco Conceptual
