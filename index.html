Táctico Unificado", "section": "Tercera Sección · Marco Conceptual · Ritmo de Batalla", "topic": "Tercera Sección · Marco Conceptual · Ritmo de Batalla", "question": "¿Qué se logra al tomar decisiones oportunas y efectivas para actuar más rápidamente que el enemigo?", "answer": "Lograr un ritmo de batalla ventajoso para que las fuerzas amigas puedan colocar al enemigo bajo las presiones de la incertidumbre y el tiempo.", "source": "Manual físico, párr. 54-A"}, {"id": "today-187", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Tercera Sección · Marco Conceptual · Ritmo de Batalla", "topic": "Tercera Sección · Marco Conceptual · Ritmo de Batalla", "question": "¿Qué produce tomar y comunicar decisiones más rápidamente de lo que el enemigo puede reaccionar?", "answer": "Produce un ritmo en el que los enemigos no pueden competir.", "source": "Manual físico, párr. 54-B"}, {"id": "today-188", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Cuarta Sección · El Arte Militar", "topic": "Cuarta Sección · El Arte Militar", "question": "¿Qué es el Arte Militar?", "answer": "La aplicación de un conjunto de principios, reglas y normas diversas, tendientes a la preparación y conducción de la guerra por medio de las armas.", "source": "Manual físico, párr. 55"}, {"id": "today-189", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Cuarta Sección · El Arte Militar", "topic": "Cuarta Sección · El Arte Militar", "question": "¿Cómo se manifiesta el Arte Militar?", "answer": "En la creación, organización, equipamiento, educación, adiestramiento, mantenimiento y control de las Fuerzas Armadas, así como en el planeamiento y conducción de otras Operaciones Militares.", "source": "Manual físico, párr. 55"}, {"id": "today-190", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Cuarta Sección · El Arte Militar", "topic": "Cuarta Sección · El Arte Militar", "question": "¿En qué ramas se ha conceptuado el Arte Militar para su estudio?", "answer": "Estrategia, Arte Operacional, Táctica, Orgánica y Logística (EATOL).", "source": "Manual físico, párr. 56"}, {"id": "today-191", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Cuarta Sección · El Arte Militar", "topic": "Cuarta Sección · El Arte Militar", "question": "¿Qué es la Estrategia?", "answer": "La ciencia y el arte de concebir la forma de emplear los medios actuales o potenciales, para alcanzar y/o mantener los objetivos previstos a largo plazo.", "source": "Manual físico, párr. 57"}, {"id": "today-192", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Cuarta Sección · El Arte Militar", "topic": "Cuarta Sección · El Arte Militar", "question": "¿Qué es el Arte Operacional?", "answer": "El arte de planear, conducir y sostener Operaciones Militares en una campaña, conjugando acciones tácticas para alcanzar los objetivos estratégicos militares.", "source": "Manual físico, párr. 58"}, {"id": "today-193", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Cuarta Sección · El Arte Militar", "topic": "Cuarta Sección · El Arte Militar", "question": "¿Qué es la Táctica?", "answer": "La parte del Arte Militar que refiere a la actuación de los mandos, los medios de acción y las tropas en el campo de batalla, en relación con el enemigo existente y con las misiones a su cargo.", "source": "Manual físico, párr. 59"}, {"id": "today-194", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Cuarta Sección · El Arte Militar", "topic": "Cuarta Sección · El Arte Militar", "question": "¿Qué es la Orgánica?", "answer": "La que se ocupa de la reunión y disposición de los medios de acción humanos y materiales para constituir unidades, dependencias e instalaciones, con miras a su eficaz empleo en la guerra.", "source": "Manual físico, párr. 60"}, {"id": "today-195", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Cuarta Sección · El Arte Militar", "topic": "Cuarta Sección · El Arte Militar", "question": "¿Qué comprende la Orgánica?", "answer": "La estructuración funcional de los organismos; la definición de funciones, facultades, competencia y responsabilidades; y la determinación de normas y procedimientos de funcionamiento.", "source": "Manual físico, párr. 60"}, {"id": "today-196", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Cuarta Sección · El Arte Militar", "topic": "Cuarta Sección · El Arte Militar", "question": "¿A qué se ajusta la aplicación del arte de organizar?", "answer": "A los principios y técnicas generales de cualquier tipo de organización y a principios y técnicas particulares propias de las organizaciones castrenses.", "source": "Manual físico, párr. 61"}, {"id": "today-197", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Cuarta Sección · El Arte Militar", "topic": "Cuarta Sección · El Arte Militar", "question": "¿Qué es la Logística?", "answer": "La actividad administrativa militar que comprende el planeamiento y ejecución de operaciones relacionadas con abastecimientos, evacuación y mantenimiento de materiales, evacuación y hospitalización del personal, construcción de obras, alojamiento de tropas, transportes sin finalidad táctica directa, mano de obra y servicios diversos.", "source": "Manual físico, párr. 62"}, {"id": "today-198", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Cuarta Sección · El Arte Militar", "topic": "Cuarta Sección · El Arte Militar", "question": "¿Cómo se concibe el Arte Operacional como enfoque cognitivo?", "answer": "Como el enfoque cognitivo que realiza el Mando y su Estado Mayor o Grupo de Comando, empleando destreza, conocimientos, experiencia, creatividad y criterio.", "source": "Manual físico, párr. 63"}, {"id": "today-199", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Cuarta Sección · El Arte Militar", "topic": "Cuarta Sección · El Arte Militar", "question": "¿Para qué se emplea ese enfoque cognitivo?", "answer": "Para desarrollar estrategias, campañas y operaciones que permitan organizar y emplear las fuerzas militares mediante la integración de fines, formas y medios.", "source": "Manual físico, párr. 63"}, {"id": "today-200", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Cuarta Sección · El Arte Militar", "topic": "Cuarta Sección · El Arte Militar", "question": "¿Cuál es la base del Arte Operacional?", "answer": "Una visión amplia y la habilidad para planear, preparar, ejecutar y cumplir con la misión.", "source": "Manual físico, párr. 63"}, {"id": "today-201", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Cuarta Sección · El Arte Militar", "topic": "Cuarta Sección · El Arte Militar", "question": "¿Cómo apoya el Diseño Operacional al Arte Operacional?", "answer": "Proporcionándole la metodología necesaria para mejorar la comprensión de la situación, Entorno Operacional y problema a resolver.", "source": "Manual físico, párr. 64"}, {"id": "today-202", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Cuarta Sección · El Arte Militar", "topic": "Cuarta Sección · El Arte Militar", "question": "¿Qué es el Centro de Gravedad (COG) como parte de los elementos del Diseño Operacional?", "answer": "Una herramienta del Comandante y su Estado Mayor o Grupo de Comando para auxiliarlo a visualizar y describir de forma amplia el enfoque operacional para alcanzar objetivos y cumplir la misión.", "source": "Manual físico, párr. 65"}, {"id": "today-203", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Cuarta Sección · El Arte Militar", "topic": "Cuarta Sección · El Arte Militar", "question": "¿Qué son los Centros de Gravedad (COG)?", "answer": "Características, funciones o localidades de las que una Nación, una alianza, una fuerza militar u otra agrupación deriva su voluntad de acción, la fuerza física o la voluntad para luchar.", "source": "Manual físico, párr. 66"}, {"id": "today-204", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Cuarta Sección · El Arte Militar", "topic": "Cuarta Sección · El Arte Militar", "question": "¿Qué son las Capacidades Críticas (CC)?", "answer": "Aquello de lo que depende el COG; básicamente, la habilidad de hacer algo.", "source": "Manual físico, párr. 67"}, {"id": "today-205", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Cuarta Sección · El Arte Militar", "topic": "Cuarta Sección · El Arte Militar", "question": "¿Cómo son consideradas las Capacidades Críticas (CC)?", "answer": "Como un factor indispensable para que el COG funcione como tal y esenciales para el cumplimiento de los objetivos.", "source": "Manual físico, párr. 67"}, {"id": "today-206", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Cuarta Sección · El Arte Militar", "topic": "Cuarta Sección · El Arte Militar", "question": "¿Qué son los Requerimientos Críticos (CR)?", "answer": "Las condiciones, recursos o medios de los que dependen las Capacidades Críticas para ser efectivas.", "source": "Manual físico, párr. 68"}, {"id": "today-207", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Cuarta Sección · El Arte Militar", "topic": "Cuarta Sección · El Arte Militar", "question": "¿Qué son las Vulnerabilidades Críticas (CV)?", "answer": "Lo que podemos influenciar de los Requerimientos Críticos o lo que los hace susceptibles; un COG se ataca o se defiende por medio de sus CV.", "source": "Manual físico, párr. 69"}, {"id": "today-208", "chapter": "Capítulo I · Marco Conceptual Táctico Unificado", "section": "Cuarta Sección · El Arte Militar", "topic": "Cuarta Sección · El Arte Militar", "question": "En el nivel operacional, ¿con qué se asocia el COG?", "answer": "Con las capacidades militares; puede incluir otras capacidades en el Entorno Operacional y normalmente es físico o tangible.", "source": "Manual físico, párr. 70"}];
const STORAGE_KEY = "bitacora_tactico_v1";
let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
let order = BANK.map(x=>x.id);
let mobileIndex = 0;

const sectionFilter = document.getElementById("sectionFilter");
const modeFilter = document.getElementById("modeFilter");
const list = document.getElementById("list");

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const sections = [...new Set(BANK.map(x=>x.section))];
const sectionCounts = Object.fromEntries(sections.map(s => [s, BANK.filter(x=>x.section===s).length]));
sectionFilter.innerHTML =
  `<option value="all">General · Todas las secciones (${BANK.length})</option>` +
  sections.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)} (${sectionCounts[s]})</option>`).join("");

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); updateStats(); }
function grade(id, value) { state[id] = value; save(); render(); }
function toggleAnswer(id) { document.getElementById("ans-"+id)?.classList.toggle("show"); }

function filtered() {
  let arr = order.map(id=>BANK.find(x=>x.id===id)).filter(Boolean);
  if (sectionFilter.value !== "all") arr = arr.filter(x=>x.section===sectionFilter.value);
  const mode = modeFilter.value;
  if (mode==="unanswered") arr = arr.filter(x=>!state[x.id]);
  if (mode==="wrong") arr = arr.filter(x=>state[x.id]==="partial" || state[x.id]==="incorrect");
  if (mode==="correct") arr = arr.filter(x=>state[x.id]==="correct");
  return arr;
}

function isMobileView(){
  return window.matchMedia("(max-width: 900px)").matches;
}

function renderCard(x, idx, total){
  const g=state[x.id]||"";
  return `<article class="card">
    <div class="meta">${escapeHtml(x.section)} · ${idx+1} de ${total}${x.source ? " · "+escapeHtml(x.source) : ""}</div>
    <div class="q">${escapeHtml(x.question)}</div>
    <div class="answer" id="ans-${x.id}"><strong>Respuesta:</strong> ${escapeHtml(x.answer)}</div>
    <div class="actions">
      <button class="grade good ${g==="correct"?"active":""}" onclick="grade('${x.id}','correct')">✓ Correcta</button>
      <button class="grade mid ${g==="partial"?"active":""}" onclick="grade('${x.id}','partial')">◐ Incompleta</button>
      <button class="grade bad ${g==="incorrect"?"active":""}" onclick="grade('${x.id}','incorrect')">✕ Incorrecta</button>
      <button class="reveal" onclick="toggleAnswer('${x.id}')">Ver respuesta</button>
    </div>
  </article>`;
}

function render() {
  const arr = filtered();
  const nav = document.getElementById("mobileNav");
  if (!arr.length) {
    list.innerHTML='<div class="empty">No hay preguntas con este filtro.</div>';
    if(nav) nav.style.display="none";
    updateStats();
    return;
  }

  if (isMobileView()) {
    if (mobileIndex >= arr.length) mobileIndex = arr.length - 1;
    if (mobileIndex < 0) mobileIndex = 0;
    list.innerHTML = renderCard(arr[mobileIndex], mobileIndex, arr.length);
    if(nav) nav.style.display="grid";
    document.getElementById("mobileCount").textContent = `${mobileIndex+1} / ${arr.length}`;
    document.getElementById("prevBtn").disabled = mobileIndex === 0;
    document.getElementById("nextBtn").disabled = mobileIndex === arr.length-1;
  } else {
    list.innerHTML = arr.map((x,idx)=>renderCard(x,idx,arr.length)).join("");
    if(nav) nav.style.display="none";
  }
  updateStats();
}

function updateStats() {
  const scope = filtered();
  let c=0,p=0,b=0;
  for (const x of scope) {
    if(state[x.id]==="correct") c++;
    if(state[x.id]==="partial") p++;
    if(state[x.id]==="incorrect") b++;
  }
  const a=c+p+b;
  const pct=a ? Math.round(((c + p*0.5)/a)*100) : 0;
  document.getElementById("score").textContent=pct+"%";
  document.getElementById("answered").textContent=a+" / "+scope.length;
  document.getElementById("correct").textContent=c;
  document.getElementById("partial").textContent=p;
  document.getElementById("incorrect").textContent=b;
  document.getElementById("progressBar").style.width=pct+"%";
}

sectionFilter.addEventListener("change", ()=>{ mobileIndex=0; render(); });
modeFilter.addEventListener("change", ()=>{ mobileIndex=0; render(); });
document.getElementById("shuffleBtn").addEventListener("click",()=>{
  order=[...order].sort(()=>Math.random()-.5);
  render();
  window.scrollTo({top:0,behavior:"smooth"});
});
document.getElementById("resetBtn").addEventListener("click",()=>{
  if(confirm("¿Borrar las marcas de esta evaluación en este dispositivo?")) {
    state={};
    save();
    render();
  }
});


document.getElementById("prevBtn").addEventListener("click",()=>{
  mobileIndex=Math.max(0,mobileIndex-1);
  render();
  window.scrollTo({top:0,behavior:"smooth"});
});
document.getElementById("nextBtn").addEventListener("click",()=>{
  const arr=filtered();
  mobileIndex=Math.min(arr.length-1,mobileIndex+1);
  render();
  window.scrollTo({top:0,behavior:"smooth"});
});
window.addEventListener("resize",()=>{ render(); });

render();
</script>
