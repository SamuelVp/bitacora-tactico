<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Juego MOM · Promoción 2027</title><style>
:root{font-family:system-ui,Arial;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;background:#eef3f4;color:#193238}header{background:#174d3e;color:#fff;padding:20px}main{max-width:900px;margin:auto;padding:16px}.card{background:white;border-radius:15px;padding:20px;margin:14px 0;box-shadow:0 2px 12px #1232}h1{font-size:25px}.flex{display:flex;flex-wrap:wrap;gap:8px;align-items:center}button,select{font:inherit;border:1px solid #9cb7b8;border-radius:9px;padding:10px 12px;background:#fff;color:#174d3e;cursor:pointer}button.active,button.main{background:#137659;color:white;border-color:#137659}.passage{font-size:17px;line-height:2.8;margin:20px 0}.blank{vertical-align:baseline;width:125px;max-width:45vw;margin:0 3px;padding:4px 6px;border:0;border-bottom:2px solid #859da0;background:#edf5f4;text-align:center;font:inherit;font-weight:600;color:#193238;border-radius:4px}.blank:focus{outline:none;border-color:#008c62}.correct{border-color:#16884e;background:#e2f6ea}.wrong{border-color:#c33;background:#ffe5e6}.fix{font-size:12px;color:#bb4d20}.muted{color:#607478;font-size:14px}.reference{white-space:pre-wrap;line-height:1.8;background:#eaf8ef;padding:12px;border-left:4px solid #148c60}textarea{width:100%;min-height:190px;font:inherit;padding:12px;border-radius:8px;border:1px solid #8ea}#feedback{font-weight:bold;margin:12px 0}@media(prefers-color-scheme:dark){body{background:#111d22;color:#e7eff1}.card{background:#1e3138}.muted{color:#a9c0c4}button,select,textarea{background:#263e46;color:#fff}.blank{background:#29434b;color:#fff}.correct{background:#20523b}.wrong{background:#622e36}.reference{background:#1b4032}}
/* Animaciones de recompensa y corrección, estilo caricatura, sin recursos externos. */
#gameCelebration{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;pointer-events:none;background:rgba(9,34,32,.72);animation:sceneIn .25s ease-out}
#gameCelebration.visible{display:flex}
#gameCelebration .scene{width:min(94vw,610px);min-height:310px;box-shadow:0 25px 60px #0005;background:linear-gradient(#dff6e9 0%,#e8f7e6 72%,#95bc90 72%);border:5px solid #faf8d1;border-radius:22px;position:relative;overflow:hidden;color:#124535;text-align:center;padding:25px 12px 15px}
#gameCelebration.bad .scene{background:linear-gradient(#fce3ca 0%,#fff1dc 72%,#d5ad81 72%);border-color:#fbebdb;color:#763d23}
#gameCelebration h2{font-size:clamp(20px,4vw,31px);line-height:1.25;margin:0;font-weight:900}
#gameCelebration p{margin:6px 0;font-weight:650}
.scene-soldiers{display:flex;align-items:end;justify-content:center;gap:clamp(12px,5vw,42px);height:180px}
.cartoon-soldier{position:relative;width:82px;height:138px;flex:0 0 82px;transform-origin:50% 100%;animation:bounceSoldier .6s ease-in-out 2 alternate}
.cartoon-soldier .cap{position:absolute;left:15px;top:6px;width:52px;height:23px;background:#52764d;border-radius:18px 18px 3px 3px;border:2px solid #35563c}
.cartoon-soldier .cap:after{content:"★";font-size:13px;color:#f7cc4a}
.cartoon-soldier .head{position:absolute;left:21px;top:26px;width:42px;height:43px;background:#e4a97b;border:2px solid #a56c4c;border-radius:45%;z-index:2}
.cartoon-soldier .head:after{content:"•  •";color:#43352a;font-size:17px;position:absolute;left:9px;top:6px}
.cartoon-soldier .torso{position:absolute;left:17px;top:65px;width:50px;height:50px;background:#6e925e;border:2px solid #395943;border-radius:7px}
.cartoon-soldier .torso:after{content:"";position:absolute;top:27px;left:0;right:0;border-top:5px solid #42573b}
.cartoon-soldier .leg{position:absolute;top:110px;width:18px;height:28px;background:#425840;border-radius:0 0 4px 4px}
.cartoon-soldier .leg.left{left:19px}.cartoon-soldier .leg.right{right:14px}
.cartoon-soldier .arm{position:absolute;top:72px;width:16px;height:47px;background:#668657;border:2px solid #395943;border-radius:9px;transform-origin:50% 7px;z-index:3}
.cartoon-soldier .arm.left{left:2px}.cartoon-soldier .arm.right{right:0}
.good .cartoon-soldier .arm.right{animation:saluteArm .9s ease-in-out infinite alternate}
.bad .cartoon-soldier.front{animation:comicalJump .38s ease-in-out 3}
.bad .cartoon-soldier.front .arm.right{transform:rotate(-30deg)}
.bad .cartoon-soldier.teacher .arm.right{animation:paddleArm .44s ease-in-out 3;transform-origin:center 6px}
.paddle{position:absolute;width:11px;height:64px;top:96px;left:17px;background:#a46e3a;border-radius:8px;transform:rotate(-35deg);border:1px solid #70461b;z-index:5}
.paddle:before{content:"";position:absolute;left:-8px;top:42px;width:25px;height:30px;border-radius:50%;background:#ac7945;border:1px solid #70461b}
.bad .cartoon-soldier.teacher .paddle{animation:paddleSwing .44s ease-in-out 3}
#gameCelebration .star{position:absolute;font-size:30px;animation:starSpin 1s ease-out infinite;opacity:.9}
#gameCelebration .star.a{top:55px;left:7%}#gameCelebration .star.b{top:85px;right:9%;animation-delay:.3s}
@keyframes sceneIn{from{opacity:0}to{opacity:1}}
@keyframes bounceSoldier{from{transform:translateY(0)}to{transform:translateY(-12px)}}
@keyframes saluteArm{from{transform:rotate(0)}to{transform:translate(4px,-17px) rotate(-130deg)}}
@keyframes paddleArm{0%,100%{transform:rotate(15deg)}50%{transform:rotate(-55deg)}}
@keyframes paddleSwing{0%,100%{transform:rotate(-35deg)}50%{transform:translate(-28px,-15px) rotate(65deg)}}
@keyframes comicalJump{0%,100%{transform:translate(0,0)}50%{transform:translate(0,-17px) rotate(5deg)}}
@keyframes starSpin{0%{transform:scale(.5) rotate(0)}50%{transform:scale(1.25) rotate(80deg)}100%{transform:scale(.5) rotate(160deg)}}
@media(prefers-reduced-motion:reduce){#gameCelebration *,#gameCelebration{animation:none!important}}
</style></head><body><div id="gameCelebration" aria-live="polite" role="status"><div class="scene"><span class="star a">✦</span><span class="star b">✦</span><h2 id="gameSceneTitle"></h2><p id="gameSceneSubtitle"></p><div class="scene-soldiers" id="gameSceneSoldiers"></div></div></div>
<header><div style="max-width:900px;margin:auto"><a style="color:#ddffeb" href="index.html">← Volver al índice</a><h1>🎖️ Juego · MOM 2018</h1><div>Promoción 2027 · Definiciones textuales</div></div></header>
<main><div class="card"><h2>Tres modalidades</h2><div class="flex" id="modes"><button class="active" data-mode="1">1 · Inicial</button><button data-mode="2">2 · Intermedio</button><button data-mode="3">3 · Avanzado</button></div><p id="hint" class="muted">Completa palabras dentro del párrafo.</p><label>Concepto: <select id="topic"></select></label><div class="flex" style="margin-top:12px"><button id="next">Siguiente concepto →</button><button id="errors">Repasar errores</button><button id="reset">Borrar progreso</button></div></div>
<div class="card"><h3 id="heading"></h3><div id="content" class="passage"></div><div id="feedback" aria-live="polite"></div><div class="flex"><button id="check" class="main">Calificar respuestas</button><button id="again" style="display:none">Repetir</button></div><div id="reference" class="reference" style="display:none"></div></div><p class="muted">Fuente: MOM 2018 Recortado. Primera etapa: párrafos de los capítulos IV, V y VI. Guarda los resultados en este navegador.</p></main>
<script>
const DATA=[["86","El Arte Militar","El Arte Militar, es la aplicación de un conjunto de principios, reglas y normas diversas, tendientes a la preparación y conducción de la guerra por medio de las armas; se manifiesta en la creación, organización, equipamiento, educación, adiestramiento, mantenimiento y control de las fuerzas armadas, así como, en el planeamiento y conducción de otras operaciones militares.",["principios","preparación","conducción","organización","adiestramiento","mantenimiento"]],["87","Práctica del Arte Militar","La práctica del Arte Militar, así como las actividades militares resultantes de su aplicación, están influenciadas en la paz y en la guerra por la administración, ya que interviene en aspectos legales, de conservación, económicos, educativos, disciplinarios, contables, de control y en actividades de toda índole. Este hecho origina que para fines prácticos, las actividades militares se dividan para su estudio y ejecución, de la manera siguiente: A. Actividades operativas o del campo de las operaciones. B. Actividades administrativas o del campo de la administración.",["práctica","administración","legales","conservación","disciplinarios","operativas","administrativas","operaciones"]],["88","Actividades operativas","Las actividades operativas, son fundamentalmente las estratégicas, operacionales y tácticas.",["operativas","estratégicas","operacionales","tácticas"]],["89","Actividades administrativas y logísticas","Las actividades administrativas, son las que se refieren a la dirección y ejecución de las funciones militares no contempladas dentro de las estratégicas, operacionales y tácticas, como sigue: A. Tienen por objeto, satisfacer las necesidades de organización, logísticas, de manejo y control de personal, de asuntos civiles y gobierno militar, de trámite, documentación, archivo, estadística e historial, de contabilidad y control de bienes, cargos, consumos y finanzas, de justicia, disciplina, orden y policía, de régimen y economía internos en unidades y dependencias, de moral, bienestar y seguridad social, en general, todas aquellas que no caigan en el campo de las actividades operativas. B. Dentro de estas actividades se encuentran las actividades logísticas, las cuales revisten aspectos administrativos y operativos, por lo que deben considerarse dentro del campo de las operaciones y a la vez dentro del campo de la administración.",["administrativas","dirección","ejecución","organización","logísticas","personal","civiles","documentación","disciplina","bienestar","administrativos","operativos"]],["90","Ramas del Arte Militar","El Arte Militar, ha sido conceptuado para su estudio, en diversas ramas de conocimiento y actividad, que son: A. Estrategia. B. Arte operacional. C. Táctica. D. Orgánica. E. Logística.",["Estrategia","operacional","Táctica","Orgánica","Logística"]],["91","Estrategia","Estrategia. Es la ciencia y el arte de concebir la forma de emplear los medios actuales o potenciales, para alcanzar y/o mantener los objetivos previstos a largo plazo.",["ciencia","arte","medios","actuales","potenciales","objetivos","largo"]],["92","Arte operacional","Arte operacional. Es el arte de planear, conducir y sostener operaciones militares en una campaña, conjugándose acciones tácticas de forma que su combinación y coordinación permitan alcanzar los objetivos estratégicos militares, empleando fuerzas terrestres, marítimas, aéreas, especiales, irregulares y unidades de guerra electrónica, asimismo, combinando acciones con los diferentes órganos de gobierno.",["planear","conducir","sostener","campaña","tácticas","coordinación","estratégicos","terrestres","marítimas","electrónica"]],["93","Táctica","Táctica. Es la parte del Arte Militar que, refiere a la actuación de los mandos, los medios de acción y las tropas en el campo de batalla, en relación con el enemigo existente y con las misiones a su cargo.",["Táctica","actuación","mandos","tropas","batalla","enemigo","misiones"]],["94","Orgánica","La orgánica. Es la que se ocupa de la reunión y disposición de los medios de acción humanos y materiales para constituir unidades, dependencias e instalaciones, con miras a su eficaz empleo en la guerra; comprende, la estructuración funcional de los organismos, la definición de las funciones, facultades, competencia, responsabilidades, la determinación de las normas y procedimientos de funcionamiento para los organismos creados.",["orgánica","reunión","disposición","humanos","materiales","unidades","dependencias","instalaciones","funciones","responsabilidades"]],["95","Arte de organizar","La aplicación del arte de organizar, se ajusta a los principios y técnicas generales que se manifiestan en cualquier tipo de organización y a su vez, a principios y técnicas particulares que se manifiestan en las organizaciones castrenses, exclusivamente.",["organizar","principios","técnicas","generales","particulares","castrenses"]],["96","Logística","La logística. Es la actividad administrativa militar que comprende el planeamiento y ejecución de operaciones en relación con los abastecimientos; la evacuación y el mantenimiento de materiales; la evacuación y hospitalización del personal; la construcción de obras y el alojamiento de las tropas; los transportes que no tengan finalidad táctica directa; el empleo de mano de obra y de servicios diversos.",["logística","administrativa","planeamiento","abastecimientos","evacuación","mantenimiento","hospitalización","alojamiento","transportes"]],["97","Niveles de conducción","Dentro de las operaciones militares se pueden definir tres niveles de conducción, estos son: A. Nivel estratégico. Establece los objetivos estratégico- militares, en éste nivel se lleva a cabo el planeamiento orientado a determinar los medios que se requerirán para alcanzar dichos objetivos, así como su sostenimiento durante el tiempo que se tenga previsto realizar operaciones. B. Nivel operacional. Vincula el nivel estratégico y el táctico, para llevar a cabo el planeamiento y conducción de las operaciones (normalmente conjuntas o combinadas) que permitan alcanzar objetivos estratégicos- militares dentro de un área operacional. C. Nivel táctico. Establece objetivos militares asignados a los componentes tácticos, planeamiento y ejecución de las operaciones se centran en la maniobra táctica dentro de un área específica, así como en los movimientos logísticos para apoyarla.",["estratégico","objetivos","planeamiento","medios","sostenimiento","operacional","Vincula","táctico","conjuntas","combinadas","maniobra","logísticos"]],["98","Fases de la guerra","Al delimitar un conflicto bélico por épocas, con base en la manifestación de ciertas actividades que les son comunes, se identifican tres fases, claramente definidas por las tareas que la política y la estrategia militar desarrollan, estas fases son: A. La preguerra. B. La guerra. C. La postguerra.",["bélico","épocas","fases","política","estrategia","preguerra","guerra","postguerra"]],["99","Preguerra","La Preguerra. Es una lucha política internacional; es la fase anterior a la guerra propiamente dicha; es decir, anterior a las hostilidades, a la declaración del estado de guerra y a la etapa de las operaciones armadas. En esta fase los Estados o grupos en pugna se dedican a prepararse para la guerra en todos los frentes y a hostilizarse al máximo en los campos diplomático, político, económico y propagandístico, incluyendo demostraciones de fuerza militar, que a veces ocasionan incidentes más o menos graves y hechos de armas.",["Preguerra","internacional","hostilidades","declaración","armadas","pugna","diplomático","económico","propagandístico","demostraciones"]],["100","Guerra Fría","Durante el siglo XX algunos países denominaron a la preguerra como “Guerra Fría”, término originado en artículos periodísticos, plasmado en libros y adoptado por determinados países con carácter oficial, como parte de su doctrina, por convenirles o interesarles hacer parecer como guerra a alguna fase política sumamente álgida, pero sin dejar de estar en tiempo de paz desde todos los puntos de vista.",["siglo","preguerra","Fría","periodísticos","doctrina","álgida","paz"]],["101","Actos durante la preguerra","En la preguerra se producen intervenciones disimuladas, se fomenta la subversión, se llevan a cabo demostraciones de fuerza militar, se atacan los contendientes en los foros internacionales, se provocan entre sí trastornos económicos, se desarrolla propaganda que contiene rumores negativos, propalando falsas alarmas o mencionando incluso verdades que no debieran ser descubiertas.",["intervenciones","disimuladas","subversión","demostraciones","internacionales","económicos","propaganda","rumores","alarmas","verdades"]],["102","Guerra Fría para México","Para México no existe la “Guerra Fría”, aun cuando reconozca los hechos que se suceden en diversas partes del mundo, no es aceptable el concepto ni el término en vista de que, siendo el gobierno mexicano respetuoso y cuidadoso en extremo de la observancia del derecho internacional, no puede reconocer como “guerra” la situación en la que ésta no se manifiesta conforme a derecho, o cuando menos de hecho, pero con todas las características que conforman un verdadero conflicto bélico.",["México","Fría","concepto","término","internacional","derecho","hecho","conflicto","bélico"]],["103","Guerra","La guerra, es la fase real del conflicto, la lucha en sí. En la que, existiendo o no una declaración de guerra, se han iniciado las actividades operativas con las fuerzas armadas de uno o más de los Estados en pugna. Se inicia con acciones fronterizas o de fuerzas navales o aéreas y culminan con la derrota de uno de los beligerantes, o mediante un armisticio.",["guerra","real","conflicto","declaración","operativas","fronterizas","aéreas","derrota","armisticio"]],["104","Postguerra","La postguerra, es la fase inmediata a la culminación del conflicto. Es cuando la parte vencedora ha logrado la consecución de sus objetivos políticos y la parte derrotada se dedica a reconstruir su estructura política, social y económica, influido o no por las condiciones que el vencedor haya impuesto.",["postguerra","inmediata","culminación","vencedora","objetivos","derrotada","reconstruir","política","social"]],["105","Guerra en México","Siendo la política exterior de México esencialmente pacifista, considera que todo conflicto internacional puede y debe resolverse por medios pacíficos y que no existe controversia que amerite la guerra como única forma de solucionarse. Sin embargo, no ignora la posibilidad de que en determinadas circunstancias pueda surgir un agresor, por lo que, por mandato constitucional, existen las fuerzas armadas para la defensa nacional. Por lo tanto, una guerra para México sólo podrá ser en defensa de nuestro propio territorio e impuesta por un caso de agresión.",["pacifista","internacional","pacíficos","controversia","agresor","constitucional","defensa","territorio","agresión"]],["106","Recursos para la guerra","En caso de guerra, la nación la hará con todos los recursos disponibles, por lo que se manifestarán en ella aspectos políticos, económicos, tecnológicos, psicológicos y sociales.",["guerra","recursos","políticos","económicos","tecnológicos","psicológicos","sociales"]],["107","Fuerzas Armadas mexicanas","El aspecto militar de la guerra estará reservado a las fuerzas armadas mexicanas: Ejército, Fuerza Aérea y Armada, a efecto de confrontar con éxito las amenazas tradicionales o multidimensionales en los niveles estratégico, operacional y táctico, de origen interno o externo, provenientes de agentes estatales o no estatales.",["militar","Ejército","Aérea","Armada","tradicionales","multidimensionales","estratégico","operacional","táctico","interno","externo","estatales"]],["108","Guerra convencional","En caso de una guerra convencional, cuando las fuerzas armadas sean superadas y dispersadas, la lucha continuará mediante el apoyo de toda la población del país; actuando en guerra de guerrillas, resistencia y subversión, hasta lograr la reorganización de las mismas y la derrota de la nación enemiga.",["convencional","superadas","dispersadas","población","guerrillas","resistencia","subversión","reorganización","derrota"]]];
const E=id=>document.getElementById(id);

let sceneTimeout;
function soldier(kind){
  return '<div class="cartoon-soldier '+kind+'"><div class="cap"></div><div class="head"></div><div class="torso"></div><div class="leg left"></div><div class="leg right"></div><div class="arm left"></div><div class="arm right"></div>'+(kind==='teacher'?'<div class="paddle"></div>':'')+'</div>';
}
function showGameAnimation(success){
  const overlay=E("gameCelebration");
  clearTimeout(sceneTimeout);
  overlay.className=success?"visible good":"visible bad";
  E("gameSceneTitle").textContent=success?"¡VISTA A LA DERECHA… YA!":"¡TOCA REPASAR, SOLDADO!";
  E("gameSceneSubtitle").textContent="";
  E("gameSceneSoldiers").innerHTML=success?
    soldier("saluter")+soldier("saluter")+soldier("saluter"):
    soldier("teacher")+soldier("front");
  sceneTimeout=setTimeout(()=>{overlay.className="";},3100);
}

const normal=s=>String(s||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[.,;:]+$/,"");
let mode=1,pos=0,progress={};
try{progress=JSON.parse(localStorage.getItem("mom_cloze_scores")||"{}")}catch(e){}
function save(){try{localStorage.setItem("mom_cloze_scores",JSON.stringify(progress))}catch(e){}}
DATA.forEach((d,i)=>{let option=document.createElement("option");option.value=i;option.textContent=d[0]+" · "+d[1];E("topic").append(option)});
function chunks(d){let count=mode===1?Math.min(3,d[3].length):d[3].length;let list=d[3].slice(0,count),str=d[2],out=[],used=[];
for(const word of list){let pattern=new RegExp("(^|[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ])("+word+")(?=$|[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ])","i"),match=pattern.exec(str);if(match){let start=match.index+match[1].length;used.push({start,end:start+match[2].length,answer:match[2]})}}
used.sort((a,b)=>a.start-b.start);let last=0;for(const u of used){if(u.start<last)continue;out.push({text:str.slice(last,u.start)});out.push({answer:u.answer});last=u.end}out.push({text:str.slice(last)});return out}
function render(){let d=DATA[pos];E("heading").textContent="Párrafo "+d[0]+" · "+d[1];E("feedback").textContent="";E("reference").style.display="none";E("again").style.display="none";E("check").style.display="inline-block";E("content").replaceChildren();E("hint").textContent=mode===1?"Inicial: 2 o 3 palabras ocultas dentro del párrafo.":mode===2?"Intermedio: más palabras ocultas, sin banco de respuestas.":"Avanzado: recuerda la definición completa sin ver el texto y compárala con el manual.";
if(mode===3){const t=document.createElement("textarea");t.placeholder="Escribe de memoria el concepto o recítalo en voz alta y luego compruébalo.";t.id="free";E("content").append(t);E("check").textContent="Mostrar texto original";return}
E("check").textContent="Calificar respuestas";let n=0;for(const part of chunks(d)){if(part.text!==undefined){E("content").append(document.createTextNode(part.text))}else{const input=document.createElement("input");input.className="blank";input.dataset.answer=part.answer;input.setAttribute("aria-label","Palabra "+(++n));input.autocomplete="off";input.spellcheck=false;E("content").append(input)}}}
function grade(){let d=DATA[pos];if(mode===3){if(!E("free").value.trim()){E("feedback").textContent="Escribe tu recuerdo antes de comparar.";return}E("reference").textContent=d[2];E("reference").style.display="block";E("feedback").textContent="Comprueba qué conceptos recordaste. La explicación libre requiere autoevaluación u orientación oral.";E("check").style.display="none";E("again").style.display="inline-block";return}
let inputs=Array.from(E("content").querySelectorAll("input"));if(inputs.some(i=>!i.value.trim())){E("feedback").textContent="Rellena todos los espacios primero.";return}
let correct=0;for(const input of inputs){let ok=normal(input.value)===normal(input.dataset.answer);correct+=ok?1:0;input.classList.add(ok?"correct":"wrong");input.disabled=true;if(!ok){const fix=document.createElement("span");fix.className="fix";fix.textContent=" ("+input.dataset.answer+")";input.after(fix)}}
let key=d[0]+"/"+mode,old=progress[key]||{attempts:0,best:0};old.attempts++;old.best=Math.max(old.best,correct/inputs.length);progress[key]=old;save();E("feedback").textContent="Resultado: "+correct+"/"+inputs.length+". "+(correct===inputs.length?"¡Excelente!":"Revisa las palabras corregidas.");showGameAnimation(correct===inputs.length);E("check").style.display="none";E("again").style.display="inline-block";}
E("modes").addEventListener("click",e=>{let b=e.target.closest("[data-mode]");if(!b)return;mode=Number(b.dataset.mode);E("modes").querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===b));render()});
E("topic").addEventListener("change",e=>{pos=Number(e.target.value);render()});
E("next").addEventListener("click",()=>{pos=(pos+1)%DATA.length;E("topic").value=pos;render()});
E("errors").addEventListener("click",()=>{let i=DATA.findIndex(d=>{let p=progress[d[0]+"/"+mode];return p&&p.best<1});if(i<0){E("feedback").textContent="No hay errores registrados en este nivel.";return}pos=i;E("topic").value=i;render()});

E("check").addEventListener("click",grade);E("again").addEventListener("click",render);render();
