<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Juego MOM · Promoción 2027</title><style>
:root{font-family:system-ui,Arial;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;background:#eef3f4;color:#193238}header{background:#174d3e;color:#fff;padding:20px}main{max-width:900px;margin:auto;padding:16px}.card{background:white;border-radius:15px;padding:20px;margin:14px 0;box-shadow:0 2px 12px #1232}h1{font-size:25px}.flex{display:flex;flex-wrap:wrap;gap:8px;align-items:center}button,select{font:inherit;border:1px solid #9cb7b8;border-radius:9px;padding:10px 12px;background:#fff;color:#174d3e;cursor:pointer}button.active,button.main{background:#137659;color:white;border-color:#137659}.passage{font-size:17px;line-height:2.8;margin:20px 0}.blank{vertical-align:baseline;width:125px;max-width:45vw;margin:0 3px;padding:4px 6px;border:0;border-bottom:2px solid #859da0;background:#edf5f4;text-align:center;font:inherit;font-weight:600;color:#193238;border-radius:4px}.blank:focus{outline:none;border-color:#008c62}.correct{border-color:#16884e;background:#e2f6ea}.wrong{border-color:#c33;background:#ffe5e6}.fix{font-size:12px;color:#bb4d20}.muted{color:#607478;font-size:14px}.reference{white-space:pre-wrap;line-height:1.8;background:#eaf8ef;padding:12px;border-left:4px solid #148c60}textarea{width:100%;min-height:190px;font:inherit;padding:12px;border-radius:8px;border:1px solid #8ea}#feedback{font-weight:bold;margin:12px 0}@media(prefers-color-scheme:dark){body{background:#111d22;color:#e7eff1}.card{background:#1e3138}.muted{color:#a9c0c4}button,select,textarea{background:#263e46;color:#fff}.blank{background:#29434b;color:#fff}.correct{background:#20523b}.wrong{background:#622e36}.reference{background:#1b4032}}</style></head><body>
<header><div style="max-width:900px;margin:auto"><a style="color:#ddffeb" href="index.html">← Volver al índice</a><h1>🎖️ Juego · MOM 2018</h1><div>Promoción 2027 · Definiciones textuales</div></div></header>
<main><div class="card"><h2>Tres modalidades</h2><div class="flex" id="modes"><button class="active" data-mode="1">1 · Inicial</button><button data-mode="2">2 · Intermedio</button><button data-mode="3">3 · Avanzado</button></div><p id="hint" class="muted">Completa palabras dentro del párrafo.</p><label>Concepto: <select id="topic"></select></label><div class="flex" style="margin-top:12px"><button id="next">Siguiente concepto →</button><button id="errors">Repasar errores</button><button id="reset">Borrar progreso</button></div></div>
<div class="card"><h3 id="heading"></h3><div id="content" class="passage"></div><div id="feedback" aria-live="polite"></div><div class="flex"><button id="check" class="main">Calificar respuestas</button><button id="again" style="display:none">Repetir</button></div><div id="reference" class="reference" style="display:none"></div></div><p class="muted">Fuente: MOM 2018 Recortado. Primera etapa: párrafos de los capítulos IV, V y VI. Guarda los resultados en este navegador.</p></main>
<script>
const DATA=[["86","Arte Militar","El Arte Militar, es la aplicación de un conjunto de principios, reglas y normas diversas, tendientes a la preparación y conducción de la guerra por medio de las armas; se manifiesta en la creación, organización, equipamiento, educación, adiestramiento, mantenimiento y control de las fuerzas armadas, así como, en el planeamiento y conducción de otras operaciones militares.",["principios","conducción","organización","adiestramiento","equipamiento"]],["91","Estrategia","Estrategia. Es la ciencia y el arte de concebir la forma de emplear los medios actuales o potenciales, para alcanzar y/o mantener los objetivos previstos a largo plazo.",["ciencia","concebir","actuales","potenciales","largo"]],["93","Táctica","Táctica. Es la parte del Arte Militar que, refiere a la actuación de los mandos, los medios de acción y las tropas en el campo de batalla, en relación con el enemigo existente y con las misiones a su cargo.",["actuación","mandos","tropas","batalla","enemigo"]],["96","Logística","La logística. Es la actividad administrativa militar que comprende el planeamiento y ejecución de operaciones en relación con los abastecimientos; la evacuación y el mantenimiento de materiales; la evacuación y hospitalización del personal; la construcción de obras y el alojamiento de las tropas; los transportes que no tengan finalidad táctica directa; el empleo de mano de obra y de servicios diversos.",["administrativa","planeamiento","abastecimientos","evacuación","mantenimiento","hospitalización"]],["98","Fases de la guerra","Al delimitar un conflicto bélico por épocas, con base en la manifestación de ciertas actividades que les son comunes, se identifican tres fases, claramente definidas por las tareas que la política y la estrategia militar desarrollan, estas fases son: La preguerra. La guerra. La postguerra.",["bélico","fases","política","estrategia","preguerra","postguerra"]],["99","La preguerra","La Preguerra. Es una lucha política internacional; es la fase anterior a la guerra propiamente dicha; es decir, anterior a las hostilidades, a la declaración del estado de guerra y a la etapa de las operaciones armadas. En esta fase los Estados o grupos en pugna se dedican a prepararse para la guerra en todos los frentes y a hostilizarse al máximo en los campos diplomático, político, económico y propagandístico, incluyendo demostraciones de fuerza militar, que a veces ocasionan incidentes más o menos graves y hechos de armas.",["internacional","hostilidades","declaración","armadas","diplomático","propagandístico","demostraciones"]],["103","La guerra","La guerra, es la fase real del conflicto, la lucha en sí. En la que, existiendo o no una declaración de guerra, se han iniciado las actividades operativas con las fuerzas armadas de uno o más de los Estados en pugna. Se inicia con acciones fronterizas o de fuerzas navales o aéreas y culminan con la derrota de uno de los beligerantes, o mediante un armisticio.",["real","conflicto","declaración","operativas","fronterizas","derrota","armisticio"]],["104","Postguerra","La postguerra, es la fase inmediata a la culminación del conflicto. Es cuando la parte vencedora ha logrado la consecución de sus objetivos políticos y la parte derrotada se dedica a reconstruir su estructura política, social y económica, influido o no por las condiciones que el vencedor haya impuesto.",["inmediata","culminación","vencedora","objetivos","derrotada","reconstruir"]],["105","Guerra en México","Siendo la política exterior de México esencialmente pacifista, considera que todo conflicto internacional puede y debe resolverse por medios pacíficos y que no existe controversia que amerite la guerra como única forma de solucionarse. Sin embargo, no ignora la posibilidad de que en determinadas circunstancias pueda surgir un agresor, por lo que, por mandato constitucional, existen las fuerzas armadas para la defensa nacional. Por lo tanto, una guerra para México sólo podrá ser en defensa de nuestro propio territorio e impuesta por un caso de agresión.",["pacifista","pacíficos","agresor","constitucional","defensa","territorio","agresión"]],["106","Recursos de la nación","En caso de guerra, la nación la hará con todos los recursos disponibles, por lo que se manifestarán en ella aspectos políticos, económicos, tecnológicos, psicológicos y sociales.",["recursos","políticos","económicos","tecnológicos","psicológicos","sociales"]]];
const E=id=>document.getElementById(id);
const normal=s=>String(s||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[.,;:]+$/,"");
let mode=1,pos=0,progress={};
try{progress=JSON.parse(localStorage.getItem("mom_cloze_scores")||"{}")}catch(e){}
function save(){try{localStorage.setItem("mom_cloze_scores",JSON.stringify(progress))}catch(e){}}
DATA.forEach((d,i)=>{let option=document.createElement("option");option.value=i;option.textContent=d[0]+" · "+d[1];E("topic").append(option)});
function chunks(d){let count=mode===1?Math.min(3,d[3].length):d[3].length;let list=d[3].slice(0,count),str=d[2],out=[],used=[];
for(const word of list){let pattern=new RegExp("(^|[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ])("+word+")(?=$|[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ])","i"),match=pattern.exec(str);if(match){let start=match.index+match[1].length;used.push({start,end:start+match[2].length,answer:match[2]})}}
used.sort((a,b)=>a.start-b.start);let last=0;for(const u of used){if(u.start<last)continue;out.push({text:str.slice(last,u.start)});out.push({answer:u.answer});last=u.end}out.push({text:str.slice(last)});return out}
function render(){let d=DATA[pos];E("heading").textContent="Párrafo "+d[0]+" · "+d[1];E("feedback").textContent="";E("reference").style.display="none";E("again").style.display="none";E("check").style.display="inline-block";E("content").replaceChildren();E("hint").textContent=mode===1?"Inicial: 2 o 3 palabras ocultas dentro del párrafo.":mode===2?"Intermedio: más palabras ocultas, sin banco de respuestas.":"Avanzado: recuerda la definición completa sin ver el texto y compárala con el manual.";
if(mode===3){const t=document.createElement("textarea");t.placeholder="Escribe de memoria el concepto o recítalo en voz alta y luego compruébalo.";t.id="free";E("content").append(t);E("check").textContent="Mostrar texto original";return}
E("check").textContent="Calificar respuestas";let n=0;for(const part of chunks(d)){if(part.text!==undefined){E("content").append(document.createTextNode(part.text))}else{const input=document.createElement("input");input.className="blank";input.dataset.answer=part.answer;input.setAttribute("aria-label","Palabra "+(++n));input.autocomplete="off";input.spellcheck=false;E("content").append(input)}}}
function grade(){let d=DATA[pos];if(mode===3){if(!E("free").value.trim()){E("feedback").textContent="Escribe tu recuerdo antes de comparar.";return}E("reference").textContent=d[2];E("reference").style.display="block";E("feedback").textContent="Comprueba qué conceptos recordaste. La explicación libre requiere autoevaluación u orientación oral.";E("check").style.display="none";E("again").style.display="inline-block";return}
let inputs=Array.from(E("content").querySelectorAll("input"));if(inputs.some(i=>!i.value.trim())){E("feedback").textContent="Rellena todos los espacios primero.";return}
let correct=0;for(const input of inputs){let ok=normal(input.value)===normal(input.dataset.answer);correct+=ok?1:0;input.classList.add(ok?"correct":"wrong");input.disabled=true;if(!ok){const fix=document.createElement("span");fix.className="fix";fix.textContent=" ("+input.dataset.answer+")";input.after(fix)}}
let key=d[0]+"/"+mode,old=progress[key]||{attempts:0,best:0};old.attempts++;old.best=Math.max(old.best,correct/inputs.length);progress[key]=old;save();E("feedback").textContent="Resultado: "+correct+"/"+inputs.length+". "+(correct===inputs.length?"¡Excelente!":"Revisa las palabras corregidas.");E("check").style.display="none";E("again").style.display="inline-block";}
E("modes").addEventListener("click",e=>{let b=e.target.closest("[data-mode]");if(!b)return;mode=Number(b.dataset.mode);E("modes").querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===b));render()});
E("topic").addEventListener("change",e=>{pos=Number(e.target.value);render()});
E("next").addEventListener("click",()=>{pos=(pos+1)%DATA.length;E("topic").value=pos;render()});
E("errors").addEventListener("click",()=>{let i=DATA.findIndex(d=>{let p=progress[d[0]+"/"+mode];return p&&p.best<1});if(i<0){E("feedback").textContent="No hay errores registrados en este nivel.";return}pos=i;E("topic").value=i;render()});
E("reset").addEventListener("click",()=>{if(confirm("¿Borrar puntuaciones de MOM de este navegador?")){progress={};save();render()}});
E("check").addEventListener("click",grade);E("again").addEventListener("click",render);render();
</script></body></html>
