name: Import Disciplina Audios

on:
  push:
    paths:
      - '.github/workflows/import-disciplina-audios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download generated audio files
        shell: bash
        env:
          URL1: "https://dnznrvs05pmza.cloudfront.net/text_to_speech/9d0e92ac-a6b1-410c-bb12-64518a9dd386/Disciplina_A01.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZGU2MjZmMDNhNTJlNzkwYSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTM5OTI5OX0.PpNkOcqzcNGEiuXXvGl7iCUZHPD4DBpjsbwUb-VI7MU"
          URL2: "https://dnznrvs05pmza.cloudfront.net/text_to_speech/ad9dec45-b88d-47cc-b451-66e04fdbd5fc/Disciplina_A02.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiODBlNzFiMDM1YThmZGYwZCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTM2ODU3OX0.zU4lGC63xzUK6I1IMUYdHOs0v_3oETa0fYGWRnat5FU"
          URL3: "https://dnznrvs05pmza.cloudfront.net/text_to_speech/b0f02241-ed1f-4af5-ad68-01b3150458bd/Disciplina_A03.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiOGRkMzYwMzY0NzY4ZmE3NiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTQwMTc4Mn0.J7GiMV8dx_mnJYTgbBpb3AZosUHcHw9ZXeHjHvr92B4"
          URL4: "https://dnznrvs05pmza.cloudfront.net/text_to_speech/3b939b94-bc0f-47ec-9b88-d6cabc8f3d21/Disciplina_A04.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNDVhOWJkMWU4Mzg0NjhkYiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTM1MDMwMn0.tQeKYPgOImDI5R6pSyH0CJRuPbxkSAQfj1pjDbKXHTI"
        run: |
          set -euo pipefail
          mkdir -p Audios_Disciplina
          curl -fL --retry 3 "$URL1" -o Audios_Disciplina/Disciplina_A01.mp3
          curl -fL --retry 3 "$URL2" -o Audios_Disciplina/Disciplina_A02.mp3
          curl -fL --retry 3 "$URL3" -o Audios_Disciplina/Disciplina_A03.mp3
          curl -fL --retry 3 "$URL4" -o Audios_Disciplina/Disciplina_A04.mp3
          test -s Audios_Disciplina/Disciplina_A01.mp3
          test -s Audios_Disciplina/Disciplina_A02.mp3
          test -s Audios_Disciplina/Disciplina_A03.mp3
          test -s Audios_Disciplina/Disciplina_A04.mp3

      - name: Commit audios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Audios_Disciplina
          if git diff --cached --quiet; then
            echo "No audio changes to commit."
          else
            git commit -m "Add Ley de Disciplina study audios"
            git push origin main
          fi
